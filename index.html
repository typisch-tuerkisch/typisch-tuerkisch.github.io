/* ---------- 4b3. HÖRECKE: MODI ---------- */
const HOER_MODI = [["spr","Sprichwörter"],["dlg","Dialoge"],["her","Heraushören"]];
const HER_N = 10;   /* Fragen je Runde beim Heraushören */

function hoerKopf(aktiv){
  return `<div class="chips hmodi">${HOER_MODI.map(([k,l]) =>
    `<button class="${k === aktiv ? "on" : ""}" data-hmod="${k}">${esc(l)}</button>`).join("")}</div>`;
}
function wireHoerKopf(){
  app.querySelectorAll("[data-hmod]").forEach(b => {
    b.onclick = () => { stopClip(); plToken++; S.hMode = b.dataset.hmod; save(); hoerScreen(); };
  });
}
function tempoLeiste(){
  return `<div class="tempo">${TEMPI.map(([v,l]) =>
    `<button class="${tempoFaktor() === v ? "on" : ""}" data-tempo="${v}">${esc(l)}</button>`).join("")}</div>`;
}
function wireTempo(neuZeichnen){
  app.querySelectorAll("[data-tempo]").forEach(b => {
    b.onclick = () => { S.hTempo = +b.dataset.tempo; save(); stopClip(); plToken++; neuZeichnen(); };
  });
}
const keineStimme = () => canPlayAudio() ? "" : `<div class="warn">
  Auf diesem Gerät ist keine türkische Stimme installiert. Wir lesen türkische Sätze
  bewusst nicht mit einer deutschen Stimme vor, sonst würdest du dir eine falsche
  Aussprache angewöhnen. Lesen und Mitlesen funktioniert weiterhin.</div>`;

/* ---------- Dialoge ---------- */
const dlgStand = di => (S.hd && S.hd[di]) || null;
function dlgListe(){
  app.innerHTML = topbar() + reiter("hoer") + `
    <div class="hero" style="padding-bottom:10px">
      <h1>Hörecke</h1>
      <p>Gespräche, wie sie wirklich laufen. Erst hören, dann nachlesen, dann die Fragen.</p>
    </div>
    ${hoerKopf("dlg")}
    ${keineStimme()}
    <div class="path">
      ${DIALOG.map((d,di) => {
        const st = dlgStand(di);
        return `<button class="node" data-dlg="${di}">
          <div class="orb ${st ? "done" : "open"}" style="background:${d.c};border-color:${d.c};box-shadow:0 4px 0 ${d.c}99">
            ${st ? svgIcon("check") : svgIcon(d.ic)}</div>
          <div class="meta"><b>${esc(d.t)}</b><span>${esc(d.s)} · ${d.z.length} Sätze${
            st ? " · " + st.p + " von " + d.f.length + " richtig" : ""}</span></div>
        </button>`;
      }).join("")}
    </div>
    <div class="foot"><button class="cta ghost" id="back">Zurück zur Übersicht</button></div>`;
  document.getElementById("chip").onclick = profileSheet;
  document.getElementById("back").onclick = home;
  wireReiter(); wireHoerKopf();
  app.querySelectorAll("[data-dlg]").forEach(b => {
    b.onclick = () => dlgScreen(+b.dataset.dlg);
  });
}

let DLG = { di:0, zeigen:false, i:-1 };
function dlgScreen(di, zeigen){
  stopClip(); plToken++;
  DLG = { di, zeigen: zeigen === undefined ? DLG.zeigen : zeigen, i:-1 };
  dlgRender();
}
function dlgRender(){
  const d = DIALOG[DLG.di];
  app.innerHTML = topbar() + `
    <div class="hero" style="padding-bottom:8px">
      <h1>${esc(d.t)}</h1>
      <p>${esc(d.o)}</p>
    </div>
    ${keineStimme()}
    ${tempoLeiste()}
    <div class="dlgbox">
      ${d.z.map((l,li) => `<div class="dz ${l.w === "A" ? "a" : "b"} ${DLG.i === li ? "jetzt" : ""}" data-z="${li}">
        <span class="wer">${l.w === "A" ? "Du" : "Gegenüber"}</span>
        <p class="ztr">${DLG.zeigen ? esc(l.tr) : "• • •"}</p>
        ${DLG.zeigen ? `<p class="zde">${esc(l.de)}</p>` : ""}
      </div>`).join("")}
    </div>
    <div class="foot">
      <button class="cta" id="dplay">${DLG.i >= 0 ? "Noch einmal von vorn" : "Gespräch anhören"}</button>
      <button class="cta ghost" id="dtext">${DLG.zeigen ? "Text verbergen" : "Text anzeigen"}</button>
      <button class="cta ghost" id="dfrag">Zu den Fragen</button>
      <button class="cta ghost" id="dback">Zurück</button>
    </div>`;
  const g = id => document.getElementById(id);
  g("chip").onclick = profileSheet;
  g("dplay").onclick = dlgPlay;
  g("dtext").onclick = () => { DLG.zeigen = !DLG.zeigen; dlgRender(); };
  g("dfrag").onclick = () => { stopClip(); plToken++; dlgFragen(0, 0); };
  g("dback").onclick = () => { stopClip(); plToken++; dlgListe(); };
  wireTempo(dlgRender);
  app.querySelectorAll("[data-z]").forEach(b => {
    b.onclick = () => {
      const l = DIALOG[DLG.di].z[+b.dataset.z];
      stopClip(); plToken++;
      say(l.tr, "tr");
    };
  });
  if(d.tip && DLG.zeigen){
    const box = document.querySelector(".dlgbox");
    if(box) box.insertAdjacentHTML("afterend", `<div class="read" style="padding:0 16px 4px"><div class="tp">${esc(d.tip)}</div></div>`);
  }
}
function dlgPlay(){
  const my = ++plToken, d = DIALOG[DLG.di];
  let i = 0;
  const lauf = () => {
    if(my !== plToken) return;
    if(i >= d.z.length){ DLG.i = -1; dlgRender(); return; }
    DLG.i = i;
    /* nur die laufende Zeile hervorheben, ohne alles neu zu bauen */
    app.querySelectorAll("[data-z]").forEach(e => e.classList.toggle("jetzt", +e.dataset.z === i));
    const el = app.querySelector(`[data-z="${i}"]`);
    if(el) el.scrollIntoView({ block:"center", behavior:"smooth" });
    const l = d.z[i];
    i++;
    speak(l.tr, "tr", () => { if(my === plToken) setTimeout(lauf, 420); },
          { pitch: l.w === "A" ? 1.08 : 0.92 });
  };
  DLG.i = 0; lauf();
}

function dlgFragen(fi, richtig){
  const d = DIALOG[DLG.di], f = d.f[fi];
  if(!f) return dlgErgebnis(richtig);
  app.innerHTML = topbar() + `
    <div class="hero" style="padding-bottom:8px">
      <h1>${esc(d.t)}</h1>
      <p>Frage ${fi+1} von ${d.f.length}</p>

let HERPOOL = null;
function herPool(){
  if(HERPOOL) return HERPOOL;
  const seen = {}, out = [];
  const woerter = t => String(t).trim().split(/\s+/).filter(Boolean).length;
  const rein = (tr, de, art) => {
    if(!tr || !de) return;
    const k = tr.toLowerCase();
    if(seen[k]) return;
    seen[k] = 1;
    /* Die Beschriftung richtet sich nach der Länge, nicht nach der Herkunft:
       ein ganzer Satz soll nicht als Wort angekündigt werden. */
    const n = woerter(de);
    const echt = art === "Sprichwort" ? "Sprichwort" : (n <= 2 ? "Wort" : (n <= 5 ? "Wendung" : "Satz"));
    out.push({ tr, de, art: echt, n });
  };
  DIALOG.forEach(d => d.z.forEach(l => rein(l.tr, l.de, "Satz")));
  BONUS.forEach(b => b.cards.forEach(c => rein(c.tr, c.de, "Sprichwort")));
  UNITS.forEach(u => u.lessons.forEach(l => l.items.forEach(it => rein(it.tr, it.de, "Wort"))));
  HERPOOL = out;
  return out;
}

  const pool = herPool();
  const liste = mischenFest(pool.slice(), todayStr() + "-h" + runde).slice(0, HER_N);

  herRender();
}

const EXAM_N = 8, EXAM_PASS = 6;
const UEB_N = 10;

/* Mischen mit festem Startwert: derselbe Tag gibt dieselbe Übung,
   der nächste Tag eine andere. */
function mischenFest(arr, saat){
  let x = 0;
  for(let i = 0; i < saat.length; i++) x = (x * 31 + saat.charCodeAt(i)) >>> 0;
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    x = (x * 1664525 + 1013904223) >>> 0;
    const j = x % (i + 1);
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function uebungItems(ui, tag){
  const pool = [];
  lessonsOf(ui).forEach(i=>{

  });
  return mischenFest(pool, tag + "#" + ui).slice(0, Math.min(UEB_N, pool.length));
}

/* ---------- WORTGEDÄCHTNIS ----------
   Jedes Wort hat eine Stufe. Wer es kann, sieht es seltener;
   wer danebenliegt, sieht es bald wieder. Gemeistert ist ein
   Wort erst, wenn es an mehreren verschiedenen Tagen saß. */
const STUFENTAGE = [0, 1, 2, 4, 9, 21];
const MEISTER_STUFE = 4, MEISTER_TAGE = 3;

function tagPlus(tag, n){
  const d = new Date(tag + "T12:00:00");
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}

function wortAntwort(tr, richtig){
  if(!tr) return;
  if(!S.w) S.w = {};
  const t = todayStr();
  const r = S.w[tr] || { b:0, due:t, dz:0, ld:null, f:0 };
  if(richtig){
    r.b = Math.min(STUFENTAGE.length - 1, (r.b || 0) + 1);
    if(r.ld !== t){ r.dz = (r.dz || 0) + 1; r.ld = t; }
  } else {
    /* Danebengelegen heißt: heute wieder dran, nicht in ein paar Tagen. */
    r.b = 0;
    r.f = (r.f || 0) + 1;
  }
  r.due = tagPlus(t, STUFENTAGE[r.b]);
  S.w[tr] = r;
}

/* neu, gelernt, uebung, meister */
function wortStatus(tr){
  const r = S.w && S.w[tr];
  if(!r) return "neu";
  if(r.b >= MEISTER_STUFE && (r.dz || 0) >= MEISTER_TAGE) return "meister";
  if(r.b === 0 || (r.due && r.due <= todayStr())) return "uebung";
  return "gelernt";
}

function wortZahlen(){
  const z = { neu:0, gelernt:0, uebung:0, meister:0 };
  const alle = alleWoerter();
  for(const tr of alle) z[wortStatus(tr)]++;
  return z;
}

/* Alle Wörter, die in Lektionen abgefragt werden, mit einer Aufgabe dazu */
let _idx = null;
function wortIndex(){
  if(_idx) return _idx;
  _idx = new Map();
  for(const l of FLAT){
    for(const it of l.items){
      if(it.k === "choice" || it.k === "listen"){
        if(it.tr && !_idx.has(it.tr)) _idx.set(it.tr, it);
      } else if(it.k === "match" && it.pairs){
        for(const pr of it.pairs){
          if(pr[0] && !_idx.has(pr[0])) _idx.set(pr[0], it);
        }
      }
    }
  }
  return _idx;
}
const alleWoerter = () => [...wortIndex().keys()];

/* Was heute dran ist: zuerst die Fehler, dann das Fällige */
function faellige(max){
  const t = todayStr(), out = [];
  const ix = wortIndex();
  for(const [tr, r] of Object.entries(S.w || {})){
    if(!ix.has(tr)) continue;
    if(r.due && r.due <= t) out.push({ tr, b: r.b || 0, f: r.f || 0, due: r.due });
  }
  out.sort((a, b2) => (a.b - b2.b) || (b2.f - a.f) || (a.due < b2.due ? -1 : 1));
  return max ? out.slice(0, max) : out;
}

const WDH_N = 12;
function startWdh(){
  clearAdv();
  const ix = wortIndex();
  const woerter = faellige(WDH_N);
  if(!woerter.length){ home(); return; }
  const items = [];
  for(const w of woerter){
    const it = ix.get(w.tr);
    if(it && it.k !== "match") items.push(it);
    else if(it) items.push(it);
  }
  if(!items.length){ home(); return; }
  items.forEach(it=>{ delete it._played; });
  L = { idx:-1, wdh:true, items: shuffle(items), pos:0, right:0, wrong:0,
        title:"Wiederholen", state:"ask", picked:null, built:[], matched:[],
        msel:null, falsch:[], score:0, t0:Date.now() };
  render();
}

function wdhResult(){
  const n = L.items.length, gained = L.score * 10;
  addXp(gained); save(); sfx("done");
  const rest = faellige().length;
  const alle = L.score === n;
  app.innerHTML = `<div class="result${alle ? " jubel" : ""}">
    ${mascot("happy")}

  </div>

    ${(L.falsch && L.falsch.length) ? `<button class="cta ghost" id="fehler">Die ${L.falsch.length} Fehler gleich noch einmal</button>` : ""}
    ${rest ? `<button class="cta ghost" id="mehr">Weiter wiederholen</button>` : ""}
  </div>`;
  const fl = (L.falsch || []).slice();

function startFehler(items, titel){
  clearAdv();
  const list = (items || []).slice();

let L = null;

function startLesson(idx){
  clearAdv();
  const les = FLAT[idx];
  les.items.forEach(it => { delete it._played; });
  L = { idx, items: les.items.slice(), pos:0, right:0, wrong:0, title:les.t, state:"ask", picked:null, built:[], matched:[], msel:null, falsch:[], t0:Date.now() };
  render();
}

function render(){
  const it = L.items[L.pos];
  const pct = Math.round(L.pos / L.items.length * 100);
  let body = "", foot = "";

  /* ---- Aufgabe zeichnen ---- */
  if(it.k === "culture"){
    body = `<div class="q">
      <div class="q-kind">Typisch Türkisch</div>
      <div class="card">
        <p class="big">${esc(it.word)}</p>
        <p class="lit">${esc(it.lit)}</p>
        <p>${it.text}</p>
        <div class="tip">${it.tip}</div>
      </div>
      <button class="speak" id="sp" style="margin-top:14px">
        <span class="sp">🔊</span><span>${esc(it.word)}</span>
      </button>
    </div>`;
    foot = `<div class="foot"><button class="cta" id="next">Verstanden</button></div>`;
  }

  if(it.k === "choice"){
    const opts = it._opts || (it._opts = shuffle(it.opts));
    body = `<div class="q">
      <div class="q-kind">${esc(it.lbl || "Wähle die richtige Antwort")}</div>
      <h2 class="q-text">${esc(it.de)}</h2>
      <div class="opts">${opts.map((o,i)=>{
        let cls = "";
        if(L.state==="ask") cls = L.picked===i ? "sel" : "";
        else cls = (o===it.tr) ? "ok" : (L.picked===i ? "no" : "");
        return `<button class="opt ${cls}" data-opt="${i}">${esc(o)}</button>`;
      }).join("")}</div>
    </div>`;
  }

  if(it.k === "listen"){
    const opts = it._opts || (it._opts = shuffle(it.opts));
    body = `<div class="q">
      <div class="q-kind">Hören und verstehen</div>
      <h2 class="q-text">Was bedeutet das?</h2>
      <button class="speak" id="sp"><span class="sp">🔊</span><span>Antippen zum Hören</span></button>
      ${(!canSpeakTr() || L.state!=="ask")?`<p class="q-sub">${canSpeakTr()?"Gesagt wurde":"Ohne türkische Stimme auf diesem Gerät"}: <b>${esc(it.tr)}</b></p>`:""}
      <div class="opts">${opts.map((o,i)=>{
        let cls = "";
        if(L.state==="ask") cls = L.picked===i ? "sel" : "";
        else cls = (o===it.de) ? "ok" : (L.picked===i ? "no" : "");
        return `<button class="opt ${cls}" data-opt="${i}">${esc(o)}</button>`;
      }).join("")}</div>
    </div>`;
  }

  if(it.k === "build"){
    const bank = it._bank || (it._bank = shuffle(it.tiles));
    body = `<div class="q">
      <div class="q-kind">Satz bauen</div>
      <h2 class="q-text">${esc(it.de)}</h2>
      <div class="answerbox" id="ans">${L.built.map((t,i)=>`<button class="tile inans" data-rm="${i}">${esc(t)}</button>`).join("")}</div>
      <div class="bank">${bank.map((t,i)=>{
        const usedCount = L.built.filter(x=>x===t).length;
        const bankCount = bank.slice(0,i+1).filter(x=>x===t).length;
        const isUsed = usedCount >= bankCount;
        return `<button class="tile ${isUsed?"used":""}" data-add="${i}">${esc(t)}</button>`;
      }).join("")}</div>
    </div>`;
  }

  if(it.k === "match"){
    const left = it._l || (it._l = shuffle(it.pairs.map(p=>p[0])));
    const right = it._r || (it._r = shuffle(it.pairs.map(p=>p[1])));
    const cell = (v,side) => {
      const gone = L.matched.includes(v);
      const sel = L.msel && L.msel.v===v;
      return `<button class="mcell ${gone?"gone":""} ${sel?"sel":""}" data-m="${esc(v)}" data-side="${side}">${esc(v)}</button>`;
    };
    const rows = left.map((lv,i)=>cell(lv,"l") + cell(right[i],"r")).join("");
    body = `<div class="q">
      <div class="q-kind">Paare finden</div>
      <h2 class="q-text">Was gehört zusammen?</h2>
      <div class="matchgrid">${rows}</div>
    </div>`;
  }

  /* ---- Fußzeile ---- */
  if(it.k !== "culture" && it.k !== "match"){
    if(L.state === "ask"){
      const ready = it.k==="build" ? L.built.length===it.tiles.length : L.picked!==null;
      foot = `<div class="foot"><button class="cta" id="check" ${ready?"":"disabled"}>Prüfen</button></div>`;
    } else {
      const ok = L.state === "right";
      const correct = it.k==="build" ? it.ans : (it.k==="listen" ? it.de : it.tr);
      foot = `<div class="foot ${ok?"ok":"no"}">
        <div class="fb ${ok?"ok":"no"}">
          <span class="mark">${ok?"✓":"✕"}</span>
          <span><b>${ok?"Richtig":"Richtige Antwort: "+esc(correct)}</b>
          <span>${esc(it.why || (it.k==="listen" ? it.tr : ""))}</span></span>
        </div>
        <button class="cta ${ok?"":"red"}" id="next">Weiter</button>
      </div>`;
    }
  }
  if(it.k === "match"){
    const allDone = L.matched.length === it.pairs.length*2;
    foot = `<div class="foot ${allDone?"ok":""}">
      ${allDone?`<div class="fb ok"><span class="mark">✓</span><span><b>Alle Paare gefunden</b></span></div>`:""}
      <button class="cta" id="next" ${allDone?"":"disabled"}>Weiter</button>
    </div>`;
  }

  app.innerHTML = `<div class="lessbar">
      <button class="x" id="quit">✕</button>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>` + body + foot;

  wire(it);
}

let advTimer = null;
function clearAdv(){ if(advTimer){ clearTimeout(advTimer); advTimer = null; } }

function advance(){
  clearAdv();
  if(!L || !L.items) return;
  const it = L.items[L.pos];
  if(!it) return;
  if(L.exam || L.ueb || L.fehler || L.wdh){
    if(it.k === "match"){ if(!L.qWrong) L.score++; }
    else if(L.state === "right") L.score++;
  }
  L.pos++; L.state="ask"; L.picked=null; L.built=[]; L.matched=[]; L.msel=null; L.qWrong=false;
  if(L.pos >= L.items.length) finish(); else render();
}

function wire(it){
  const q = id => document.getElementById(id);
  if(q("quit")) q("quit").onclick = () => { clearAdv(); home(); };
  if(q("sp")) q("sp").onclick = () => {
    say(it.k==="culture" ? it.word : it.tr);
    const rw = q("revealWrap");
    if(rw && L.state!=="ask") rw.innerHTML = "Gesagt wurde: <b>"+esc(it.tr)+"</b>";
  };

  // auto-play beim Hörverstehen
  if(it.k==="listen" && L.state==="ask" && !it._played){ it._played = true; setTimeout(()=>say(it.tr), 350); }

  app.querySelectorAll("[data-opt]").forEach(b=>{
    b.onclick = () => { if(L.state!=="ask") return; L.picked = +b.dataset.opt; render(); };
  });

  app.querySelectorAll("[data-add]").forEach(b=>{
    b.onclick = () => {
      if(L.state!=="ask") return;
      L.built.push(it._bank[+b.dataset.add]); render();
    };
  });
  app.querySelectorAll("[data-rm]").forEach(b=>{
    b.onclick = () => { if(L.state!=="ask") return; L.built.splice(+b.dataset.rm,1); render(); };
  });

  app.querySelectorAll("[data-m]").forEach(b=>{
    b.onclick = () => {
      const v = b.dataset.m, side = b.dataset.side;
      if(L.matched.includes(v)) return;
      if(!L.msel){ L.msel = {v,side}; render(); return; }
      if(L.msel.v === v){ L.msel = null; render(); return; }
      if(L.msel.side === side){ L.msel = {v,side}; render(); return; }
      const a = L.msel.side==="l" ? L.msel.v : v;
      const bb = L.msel.side==="l" ? v : L.msel.v;
      const hit = it.pairs.some(p=>p[0]===a && p[1]===bb);
      if(hit){ L.matched.push(a,bb); L.right++; sfx("right"); wortAntwort(a, true); }
      else {
        L.wrong++; L.qWrong = true; sfx("wrong");
        merkeFalsch(it); wortAntwort(a, false);
      }
      L.msel = null; render();
    };
  });

  if(q("check")) q("check").onclick = () => {
    let ok;
    if(it.k==="build") ok = L.built.join(" ") === it.ans;
    else if(it.k==="listen") ok = it._opts[L.picked] === it.de;
    else ok = it._opts[L.picked] === it.tr;
    if(ok){
      L.right++; L.state="right"; sfx("right");
      if(it.k !== "build") wortAntwort(it.tr, true);
      render();
      /* richtig: nach einer kurzen Pause von selbst weiter,
         kein zweiter Tipp nötig */
      advTimer = setTimeout(()=>{ advTimer = null; advance(); }, 900);
      return;
    }
    L.wrong++; L.qWrong = true; L.state="wrong"; sfx("wrong");
    merkeFalsch(it);
    if(it.k !== "build") wortAntwort(it.tr, false);
    render();
  };

  if(q("next")) q("next").onclick = advance;
}

/* ---------- JUBEL ---------- */
const magMotion = () => {
  try{ return !matchMedia("(prefers-reduced-motion: reduce)").matches; }
  catch(e){ return true; }
};

function konfetti(stark){
  if(!magMotion()) return;
  const c = document.createElement("canvas");
  c.className = "fx";
  document.body.appendChild(c);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = c.width = innerWidth * dpr, h = c.height = innerHeight * dpr;
  c.style.width = innerWidth + "px"; c.style.height = innerHeight + "px";
  const ctx = c.getContext("2d");
  const COLS = ["#fc4847","#c9931f","#1d7fc0","#2f9e5c","#b8408a","#e08a2e"];
  const n = stark ? 95 : 55, P = [];
  for(let i = 0; i < n; i++) P.push({
    x: w * (0.12 + 0.76 * Math.random()),
    y: -(20 + Math.random() * h * 0.35) * dpr,
    vx: (Math.random() - 0.5) * 2.4 * dpr,
    vy: (2 + Math.random() * 2.8) * dpr,
    s: (5 + Math.random() * 6) * dpr,
    r: Math.random() * 6.3,
    vr: (Math.random() - 0.5) * 0.24,
    col: COLS[(Math.random() * COLS.length) | 0],
    rund: Math.random() < 0.32
  });
  const t0 = performance.now();
  const frame = now => {
    const el = now - t0;
    ctx.clearRect(0, 0, w, h);
    ctx.globalAlpha = el > 1900 ? Math.max(0, 1 - (el - 1900) / 900) : 1;
    for(const p of P){
      p.x += p.vx; p.y += p.vy; p.vy += 0.045 * dpr; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.col;
      if(p.rund){ ctx.beginPath(); ctx.arc(0, 0, p.s * 0.45, 0, 6.3); ctx.fill(); }
      else ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.66);
      ctx.restore();
    }
    if(el < 2800 && document.body.contains(c)) requestAnimationFrame(frame);
    else c.remove();
  };
  requestAnimationFrame(frame);
}

/* Zahl von 0 hochzaehlen */
function hochzaehlen(id, ziel, pre){
  const el = document.getElementById(id);
  if(!el) return;
  if(!magMotion()){ el.textContent = (pre || "") + ziel; return; }
  const t0 = performance.now(), dauer = 620;
  const schritt = now => {
    const k = Math.min(1, (now - t0) / dauer);
    const e = 1 - Math.pow(1 - k, 3);
    el.textContent = (pre || "") + Math.round(ziel * e);
    if(k < 1 && document.body.contains(el)) requestAnimationFrame(schritt);
  };
  requestAnimationFrame(schritt);
}

function finish(){
  if(L.wdh) return wdhResult();
  if(L.fehler) return fehlerResult();
  if(L.ueb) return uebungResult();
  if(L.exam) return examResult();
  const gained = L.right*10 + (L.wrong===0 ? 15 : 5);
  addXp(gained);
  if(!S.done.includes(L.idx)){ S.done.push(L.idx); save(); }
  const perfect = L.wrong===0;
  const total = L.right + L.wrong;
  const acc = total ? Math.round(L.right/total*100) : 100;

  app.innerHTML = `<div class="result jubel">
    ${mascot("happy")}
    <div class="bigword">${perfect ? "Ohne<br>Fehler" : "Lektion<br>geschafft"}</div>
    <p>${esc(L.title)}</p>
    <div class="scores">
      <div class="score gold"><div class="ic">${svgIcon("tea")}</div><div class="v" id="cnt">+0</div><div class="k">Çay</div></div>
      <div class="score red"><div class="ic">${svgIcon("eye")}</div><div class="v">${acc}%</div><div class="k">Treffer</div></div>
      <div class="score blue"><div class="ic">${svgIcon("clock")}</div><div class="v">${fmtTime(L.t0)}</div><div class="k">Zeit</div></div>
    </div>
  </div>
  <div class="foot">
    <button class="cta" id="cont">${probeLocked(L.idx+1) ? "Weiter geht es mit einem Profil" : "Weiter"}</button>
    ${(L.falsch && L.falsch.length) ? `<button class="cta ghost" id="fehler">Die ${L.falsch.length} Fehler gleich noch einmal</button>` : ""}
    ${(FLAT[L.idx+1] && !probeLocked(L.idx+1)) ? `<button class="cta ghost" id="nextles">Direkt zur nächsten Lektion</button>` : ""}
  </div>`;
  const fl = (L.falsch || []).slice(), ni = L.idx + 1;
  document.getElementById("cont").onclick = probeLocked(ni) ? probeEnde : home;
  const fb2 = document.getElementById("fehler");
  if(fb2) fb2.onclick = () => startFehler(fl, "");
  const nl = document.getElementById("nextles");
  if(nl) nl.onclick = () => startLesson(ni);
  sfx("done"); voiceFb(V_DONE, 520);
  hochzaehlen("cnt", gained, "+");
  konfetti(perfect);
}

function examResult(){
  const ui = L.ui, n = L.items.length;
  const need = Math.min(EXAM_PASS, Math.max(1, Math.ceil(n*0.75)));
  const ok = L.score >= need;
  const first = ok && !S.passed.includes(ui);
  if(first){ S.passed.push(ui); addXp(100); }
  else if(ok){ addXp(20); }
  save();
  sfx(ok ? "pass" : "fail");
  voiceFb(ok ? V_PASS : V_FAIL, 620);

  const nextUnit = UNITS[ui+1];
  app.innerHTML = `<div class="result${ok ? " jubel" : ""}">
    ${mascot(ok ? "happy" : "sad")}
    <div class="bigword" ${ok?"":'style="color:var(--muted);text-shadow:none"'}>${ok ? "Test<br>bestanden" : "Noch<br>nicht"}</div>
    <p>${esc(UNITS[ui].t)}</p>
    <div class="scores">
      <div class="score red"><div class="ic">${svgIcon("check")}</div><div class="v">${L.score}/${n}</div><div class="k">Richtig</div></div>
      <div class="score gold"><div class="ic">${svgIcon("star")}</div><div class="v">${need}/${n}</div><div class="k">Nötig</div></div>
      <div class="score blue"><div class="ic">${svgIcon("clock")}</div><div class="v">${fmtTime(L.t0)}</div><div class="k">Zeit</div></div>
    </div>
    <p style="margin-top:20px">${ok
      ? (first && nextUnit ? "Einheit "+(ui+2)+" ist jetzt offen: "+esc(nextUnit.t) : "Du kannst jederzeit weiterüben.")
      : "Geh die Lektionen dieser Einheit noch einmal durch und versuch es dann erneut, so oft du willst."}</p>
  </div>
  <div class="foot">
    <button class="cta ${ok?"":"red"}" id="cont">${ok?"Weiter":"Zur Übersicht"}</button>
    ${(L.falsch && L.falsch.length) ? `<button class="cta ghost" id="fehler">Die ${L.falsch.length} Fehler gleich noch einmal</button>` : ""}
    ${ok?"":`<button class="cta ghost" id="again">Test noch einmal</button>`}
  </div>`;
  const fl3 = (L.falsch || []).slice();
  document.getElementById("cont").onclick = home;
  const fb4 = document.getElementById("fehler");
  if(fb4) fb4.onclick = () => startFehler(fl3, "");
  const ag = document.getElementById("again");
  if(ag) ag.onclick = () => startExam(ui);
  if(ok) konfetti(true);
}

boot();
/* Adresse ändert sich auf #alles, während die Seite offen ist:
   der Browser lädt dann nicht neu, also hier selbst reagieren. */
try{
  window.addEventListener("hashchange", () => {
    if((location.hash || "").toLowerCase() === "#alles") boot();
  });
}catch(e){}
</script>
