<style>
  :root{
    --bg:#ffffff;
    --surface:#fbfbfc;
    --surface-2:#f1f2f5;
    --line:#e2e4ea;
    --text:#17181d;
    --muted:#70737f;
    --red:#fc4847;        /* Rot aus dem Logo */
    --red-dark:#d6322f;
    --red-soft:#fff0ef;
    --nazar:#1d7fc0;
    --nazar-dark:#14608f;
    --gold:#c9931f;
    --gold-soft:#fdf4e0;
    --green:#2f9e5c;
    --green-dark:#237a46;
    --green-soft:#e8f6ee;
    --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;
    font-weight:600;
    overscroll-behavior:none;
  }
  #app{
    max-width:460px;margin:0 auto;min-height:100%;
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button{font-family:inherit;font-weight:800;cursor:pointer;border:0;color:inherit}

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;gap:14px;padding:14px 18px 10px}
  .wortmarke{font-weight:800;font-size:15.5px;color:var(--muted);letter-spacing:-.01em}
  .wortmarke b{font-weight:900;color:var(--red)}
  .stat{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px}
  .stat .ic{font-size:18px;line-height:1}
  .stat.fire{color:var(--gold)}
  .stat.gem{color:var(--nazar)}
  .stat.word{color:var(--green)}
  .topbar .spacer{flex:1}

  /* ---------- home ---------- */
  .logo{display:block;border-radius:50%;box-shadow:0 2px 8px rgba(23,24,29,.12)}
  .logo.big{width:148px;height:148px;margin:0 auto 20px}
  .logo.sm{width:46px;height:46px;flex:none}
  .herorow{display:flex;align-items:center;gap:13px}
  .herorow .ht{flex:1;min-width:0}

  .hero{padding:4px 18px 18px}
  .hero h1{
    margin:0;font-size:25px;font-weight:900;letter-spacing:-.4px;
  }
  .hero h1 .tr{color:var(--red)}
  .hero p{margin:5px 0 0;color:var(--muted);font-size:14px;font-weight:600;line-height:1.45}

  .daily{
    margin:0 18px 18px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r);padding:14px 16px;
  }
  .daily-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .daily-row b{font-size:14px;font-weight:800}
  .daily-row span{font-size:13px;color:var(--muted);font-weight:700}
  .bar{height:9px;border-radius:99px;background:var(--surface-2);overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),#f3d383);transition:width .5s cubic-bezier(.2,.8,.2,1)}


  .orb.gruen{background:var(--green-soft);color:var(--green-dark);
             box-shadow:inset 0 0 0 2px var(--green)}
  .node.ueb{border-left:3px solid var(--green)}

  .weiter{margin:0 18px 14px;display:block;text-align:left;
          background:var(--surface);border:1px solid var(--line);
          border-left:4px solid var(--red);border-radius:var(--r);padding:14px 16px;
          width:calc(100% - 36px)}
  .weiter .wk{display:block;font-size:11px;font-weight:800;letter-spacing:1.4px;
              text-transform:uppercase;color:var(--red);margin-bottom:5px}
  .weiter .wt{display:block;font-size:17px;font-weight:900;letter-spacing:-.3px}
  .weiter .wu{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:3px}

  .weiter.kult .wt{font-size:16px;line-height:1.35}
  .kstand{font-size:14px;font-weight:700;color:var(--muted);padding:2px 0 2px}
  .kzahl{margin-top:8px;font-size:13px;font-weight:800;color:var(--green-dark)}
  .sq{margin:16px 0 4px;background:var(--red-soft);border-radius:14px;padding:14px}
  .sqk{font-size:10.5px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;
       color:var(--red-dark);margin-bottom:8px}
  .sqf{margin:0 0 12px;font-size:15px;font-weight:800;line-height:1.45;color:var(--text)}
  .sqo{display:flex;flex-direction:column;gap:8px}
  .sqo button{text-align:left;background:#fff;border:1.5px solid var(--line);
              border-radius:11px;padding:11px 13px;font-size:14px;font-weight:700;
              line-height:1.35;color:var(--text)}
  .sqo button.gut{border-color:var(--green);background:var(--green-soft);color:var(--green-dark)}
  .sqo button.schlecht{border-color:var(--red);background:#fff;color:var(--red-dark)}
  .sqo button[disabled]{opacity:1}
  .sqw{margin-top:11px;font-size:13.5px;font-weight:600;line-height:1.5;color:#6b4a49}
  .sqw b{display:block;font-weight:900;margin-bottom:3px}

  .themerow{border-left:4px solid var(--line)}
  .themerow .tt{flex:1;min-width:0;display:block}
  .themerow .tt em{display:block;font-style:normal;font-size:13.5px;font-weight:700;
                   color:var(--text);opacity:.78;line-height:1.4;margin:3px 0 4px}
  .weiter.vstk2{border-left-color:var(--gold)}
  .weiter.vstk2 .wk{color:var(--gold)}
  .vst{padding:26px 20px 10px}
  .vstk{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
        margin-bottom:12px}
  .vstf{margin:0 0 22px;font-size:21px;font-weight:900;line-height:1.38;letter-spacing:-.3px}
  .sqo.big button{padding:15px 16px;font-size:15.5px}
  .vstw{margin-top:20px;background:var(--surface);border:1px solid var(--line);
        border-radius:14px;padding:15px;font-size:14.5px;font-weight:600;line-height:1.55;
        color:var(--muted)}
  .vstw b{display:block;color:var(--text);font-weight:900;margin-bottom:4px}
  .vstmehr{margin-top:10px;font-size:12.5px;font-weight:800;color:var(--muted);opacity:.8}
  .vsthint{margin:0;text-align:center;font-size:13px;font-weight:700;color:var(--muted)}

  .weiter.wdh{border-left-color:var(--green)}
  .weiter.wdh .wk{color:var(--green-dark)}
  .wst{display:flex;gap:8px;margin:0 0 4px}
  .wst div{flex:1;background:var(--surface);border:1px solid var(--line);
           border-radius:12px;padding:10px 8px;text-align:center}
  .wst b{display:block;font-size:19px;font-weight:900;line-height:1.1}
  .wst span{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-top:3px}

  /* Kulturecke als Karten */
  .read .sec{background:var(--surface);border:1px solid var(--line);
             border-left:4px solid var(--line);border-radius:var(--r);
             padding:16px 16px 12px;margin:0 0 16px}
  .sechead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .secnum{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
          color:var(--muted)}
  .frage{margin:0 0 9px;font-size:15px;font-weight:800;line-height:1.4}
  .dh{margin:14px 0 4px;background:var(--surface-2);border-radius:12px;padding:12px 14px}
  .dhk{font-size:10.5px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;
       color:var(--muted);margin-bottom:9px}
  .dhrow{display:flex;align-items:center;gap:12px}
  .dhrow > div{flex:1;text-align:center}
  .dhrow b{display:block;font-size:19px;font-weight:900;letter-spacing:-.3px}
  .dhrow span{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-top:2px}
  .dharrow{flex:0 0 auto;color:var(--muted)}
  .dhm{margin-top:9px;font-size:12.5px;font-weight:700;color:var(--muted);text-align:center}
  .tp b{display:block;font-size:11px;font-weight:800;letter-spacing:1.1px;
        text-transform:uppercase;margin-bottom:5px;opacity:.75}

  .reiter{display:flex;gap:4px;padding:2px 12px 10px;border-bottom:1px solid var(--line);
          margin-bottom:14px;overflow-x:auto}
  .reiter button{flex:1;min-width:76px;display:flex;flex-direction:column;align-items:center;
                 gap:4px;background:none;padding:8px 4px 9px;border-bottom:2.5px solid transparent;
                 color:var(--muted);font-size:11.5px;font-weight:800;line-height:1.1}
  .reiter button span{white-space:nowrap}
  .reiter button.on{color:var(--red);border-bottom-color:var(--red)}
  .reiter .ic-svg{width:20px;height:20px}
  .themerow.zu{opacity:1}
  .themerow.zu b{color:var(--muted)}

  .vlab{font-size:14.5px;font-weight:800}
  .klangwahl{display:flex;gap:7px;margin-bottom:9px}
  .klangwahl button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
    padding:9px 4px;font-size:13px;font-weight:800;color:var(--muted)}
  .klangwahl button.on{background:var(--red-soft);border-color:var(--red);color:var(--red-dark)}

  .vol{padding:11px 2px 7px;border-bottom:1px solid var(--line)}
  .volhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
  .volhead button{background:none;font-size:14.5px;font-weight:800;display:flex;
                  align-items:center;gap:9px;padding:0}
  .volhead b{font-size:12.5px;font-weight:800;color:var(--muted)}
  .vol input[type=range]{width:100%;accent-color:var(--red);height:22px}
  .vol input[disabled]{opacity:.4}

  /* Fortschritt */
  .fswrap{padding:0 18px 30px}
  .fsstufe{background:var(--red-soft);border:1px solid #ffd9d7;border-radius:var(--r);
           padding:18px;margin-bottom:14px}
  .fsstufe .kick{font-size:11.5px;font-weight:800;letter-spacing:1.6px;
                 text-transform:uppercase;color:var(--red-dark)}
  .fsstufe h2{margin:6px 0 7px;font-size:24px;font-weight:900;letter-spacing:-.5px}
  .fsstufe p{margin:0;font-size:14.5px;font-weight:600;line-height:1.55;color:#6b4a49}
  .fsnext{margin-top:12px;font-size:13px;font-weight:700;color:var(--red-dark)}
  .fscard{background:var(--surface);border:1px solid var(--line);
          border-radius:var(--r);padding:16px}
  .fscard.tight{padding:6px 10px}
  .fsrow{margin-bottom:14px}
  .fsrow:last-of-type{margin-bottom:10px}
  .fshead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
  .fshead span{font-size:14px;font-weight:700}
  .fshead b{font-size:13px;font-weight:800;color:var(--muted)}
  .fsnote{margin:14px 0 0;font-size:13.5px;font-weight:600;line-height:1.55;color:var(--muted)}
  .fsh3{margin:22px 0 10px;font-size:15px;font-weight:900}
  .fsunit{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;
          background:none;padding:12px 8px;border-bottom:1px solid var(--line)}
  .fsunit:last-child{border-bottom:0}
  .fsunit[disabled]{opacity:1;cursor:default}
  .fsdot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
  .fsu{flex:1;min-width:0}
  .bar.sm{height:6px}
  .fstest{display:block;margin-top:6px;font-size:12px;font-weight:700;color:var(--muted)}
  .fsend{margin:18px 2px 0;font-size:13.5px;font-weight:600;line-height:1.6;color:var(--muted)}
  .dailygo{width:100%;display:flex;justify-content:space-between;align-items:center;
           margin-top:12px;padding-top:11px;border-top:1px solid var(--line);
           background:none;font-size:13px;font-weight:800}
  .dailygo .go{color:var(--red);font-weight:800}
  .path{padding:0 18px 40px;display:flex;flex-direction:column;gap:0}
  .unit{margin-bottom:10px}
  .unit-head{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:var(--surface);border:1px solid var(--line);
    border-left:4px solid var(--red);
    border-radius:12px;padding:12px 14px;margin:16px 0 4px;
  }
  .unit-head .uh{flex:1;min-width:0}
  .unit-head .chev{
    margin-left:auto;flex:none;color:var(--muted);font-size:13px;
    width:26px;height:26px;border-radius:8px;background:var(--surface-2);
    display:grid;place-items:center;transition:transform .15s ease;
  }
  .unit-head .chev.up{transform:rotate(180deg)}
  .unit-head.locked{border-left-color:var(--line);background:var(--surface-2)}
  .unit-head.locked .t{color:#8e919c}
  .unit-head.locked .s{color:#a9acb6}
  .unit-head .n{
    width:26px;height:26px;border-radius:8px;background:var(--red);
    display:grid;place-items:center;font-size:13px;font-weight:900;flex:none;
  }
  .unit-head .t{font-size:15px;font-weight:900;line-height:1.2}
  .unit-head .s{font-size:12px;color:var(--muted);font-weight:700;margin-top:1px}

  .node{display:flex;align-items:center;gap:14px;padding:9px 2px;text-align:left;width:100%;background:none}
  .orb{
    width:58px;height:58px;border-radius:50%;flex:none;position:relative;
    display:grid;place-items:center;font-size:24px;
    background:var(--surface-2);border:2px solid var(--line);
    transition:transform .12s ease;
  }
  .node:active .orb{transform:scale(.93)}
  .orb.done{background:var(--green);border-color:var(--green-dark);box-shadow:0 4px 0 var(--green-dark)}
  .orb.open{background:var(--red);border-color:var(--red-dark);box-shadow:0 4px 0 var(--red-dark)}

  .tour{min-height:100dvh;display:flex;flex-direction:column;padding:18px 20px 26px}
  .tourtop{height:34px;display:flex;justify-content:flex-end}
  .tskip{background:none;border:0;color:var(--muted);font:inherit;font-weight:700;
         font-size:15px;padding:6px 2px;cursor:pointer}
  .tourmid{flex:1;display:flex;flex-direction:column;justify-content:center;
           align-items:center;text-align:center;padding:0 6px}
  .touric{width:104px;height:104px;border-radius:30px;display:flex;align-items:center;
          justify-content:center;margin-bottom:26px}
  .touric .ic-svg{width:52px;height:52px}
  .tourmid h2{font-size:27px;font-weight:800;letter-spacing:-.5px;margin-bottom:12px}
  .tourmid p{font-size:16px;line-height:1.55;color:var(--muted);max-width:330px}
  .tourbot{display:flex;flex-direction:column;gap:18px;align-items:center}
  .dots{display:flex;gap:7px}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
  .dots i.on{background:var(--red);width:20px;border-radius:4px}
  .tourbot .cta{width:100%}
  .ic-svg{width:26px;height:26px;display:block}

     x:"Fein gemahlener Kaffee wird im Cezve langsam aufgekocht und mit dem Satz serviert, dazu ein Glas Wasser und etwas Süßes. Die Süße wird beim Bestellen festgelegt, nicht danach.",
     tip:"Der türkische Kaffee steht seit 2013 auf der UNESCO-Liste. Aus dem Satz wird anschließend gern die Zukunft gelesen."},
    {h:"Frühstück ist eine Mahlzeit, kein Brötchen", sq:{f:"Was steht beim türkischen Frühstück auf dem Tisch?",o:["Oliven, mehrere Käse, Eier, Honig, Brot und Tee", "Kaffee und ein Brötchen", "Nur Tee und Simit"],r:0,w:"Alles kommt gleichzeitig und bleibt stehen. Kahvaltı heißt ungefähr: vor dem Kaffee."}, q:"Warum dauert ein türkisches Frühstück Stunden?", tr:"Kahvaltı",
     x:"Oliven, mehrere Käse, Tomaten, Gurken, Eier, Honig mit Sahne, Marmeladen, frisches Brot und immer Tee. Alles kommt gleichzeitig in kleinen Schalen auf den Tisch.",
     tip:"Das Wort kahvaltı heißt wörtlich: das, was unter den Kaffee kommt."},
    {h:"Essen auf der Straße", sq:{f:"Es ist Abend, du hast Hunger und willst etwas typisch Türkisches von der Straße.",o:["Midye dolma mit Zitrone", "Ein belegtes Brötchen", "Eine Dose Suppe"],r:0,w:"Straßenessen ist eigene Esskultur, kein Notfall."}, q:"Was isst man in der Türkei im Stehen?", tr:"Sokak lezzetleri",
     x:"Simit am Morgen, midye dolma mit Zitrone am Abend, kumpir mit zehn Belägen, çiğ köfte in Salatblättern. Straßenessen ist kein Notfall, sondern eigene Esskultur.",
     tip:"Döner, wie Deutschland ihn kennt, ist eine Berliner Weiterentwicklung. In der Türkei bekommst du ihn meist auf dem Teller oder in dünnem Fladen."},
    {h:"Geschützte Herkunft", sq:{f:"Auf der Packung steht Antep baklavası. Was heißt das?",o:["Sie kommt wirklich aus Gaziantep", "Sie folgt nur einem Rezept", "Es ist bloß ein Markenname"],r:0,w:"Geschützte Herkunft. Den Ortsnamen darf nur tragen, was von dort kommt."}, q:"Warum darf nicht jede Baklava Antep heißen?", tr:"Coğrafi işaret",
     x:"Viele Produkte dürfen den Ortsnamen nur tragen, wenn sie wirklich von dort kommen: Antep baklavası, Malatya kayısısı, Aydın inciri, Taşköprü sarımsağı.",
     tip:"Antep baklavası war das erste türkische Produkt mit einer geschützten Herkunftsangabe in der EU."}
  ]},
  { t:"Kunst und Handwerk", ic:"brush", c:"#9154d8", cards:[
    {h:"Teppiche erzählen", sq:{f:"Auf einem Teppich siehst du eine Frau mit den Händen in den Hüften.",o:["Eli belinde, ein Zeichen für Fruchtbarkeit", "Eine Tänzerin", "Die Weberin selbst"],r:0,w:"Die Muster sind Zeichen, kein Dekor."}, q:"Was erzählt ein Teppich, wenn man die Muster lesen kann?", tr:"Halı ve kilim",
     x:"Die Muster sind kein Dekor, sondern Zeichen. Eli belinde, die Frau mit den Händen in den Hüften, steht für Fruchtbarkeit, koçboynuzu, das Widderhorn, für Kraft.",
     tip:"Wer die Motive lesen kann, erkennt oft die Region und manchmal die Geschichte der Weberin."},
    {h:"Das Blau von İznik", sq:{f:"Woran erkennst du Fliesen aus İznik?",o:["An Tulpen, Nelken und einem besonderen Rot", "An goldener Schrift", "An schwarzen Mustern"],r:0,w:"Zwischen dem 15. und 17. Jahrhundert entstand dort dieses Rot."}, q:"Was macht die Fliesen aus İznik so besonders?", tr:"Çini",
     x:"Zwischen dem 15. und 17. Jahrhundert entstanden in İznik Fliesen mit Tulpen, Nelken und einem Rot, das später niemand mehr nachmischen konnte.",
     tip:"Ganze Moscheeinnenräume sind damit ausgekleidet. Die Tulpe kam übrigens von hier nach Holland."},
    {h:"Schrift als Bild", sq:{f:"Ebru ist Malerei auf",o:["Wasser", "Seide", "Holz"],r:0,w:"Die Farben schwimmen auf einer zähen Flüssigkeit und werden aufs Papier abgenommen."}, q:"Wie malt man auf Wasser?", tr:"Hat ve ebru",
     x:"Kalligrafie machte aus Buchstaben Kunstwerke. Ebru ist Malerei auf Wasser: Farben werden auf eine zähe Flüssigkeit getropft, gezogen und mit Papier abgenommen.",
     tip:"Ebru steht seit 2014 auf der UNESCO-Liste des immateriellen Kulturerbes."},
    {h:"Kuppeln und Portale", sq:{f:"Ein gewaltiges Steinportal mit tiefen Ornamenten. Wessen Handschrift?",o:["Der Seldschuken", "Der Osmanen", "Der Byzantiner"],r:0,w:"Die Osmanen setzten dagegen auf weite Kuppeln."}, q:"Woran erkennst du seldschukische und osmanische Bauten?", tr:"Mimari",
     x:"Die Seldschuken bauten gewaltige Steinportale mit tiefen Ornamenten. Die Osmanen setzten auf weite Kuppeln und ganze Anlagen mit Moschee, Schule, Küche und Bad.",
     tip:"Mimar Sinan baute im 16. Jahrhundert Hunderte Bauwerke. Die Selimiye in Edirne hielt er selbst für sein Meisterstück."},
    {h:"Ringen in Olivenöl", sq:{f:"Beim Kırkpınar in Edirne ringen Männer eingeölt. Seit wann gibt es das Fest?",o:["Seit dem 14. Jahrhundert", "Seit 1950", "Seit der Republik"],r:0,w:"Eines der ältesten Sportfeste, die bis heute gefeiert werden."}, q:"Warum reiben sich Ringer in Edirne mit Olivenöl ein?", tr:"Yağlı güreş",
     x:"Beim Kırkpınar in Edirne ringen Männer in Lederhosen und mit Olivenöl eingerieben. Das Fest findet seit dem 14. Jahrhundert statt.",
     tip:"Es steht seit 2010 auf der UNESCO-Liste und gilt als eines der ältesten durchgehend gefeierten Sportfeste der Welt."}
  ]},
  { t:"Nur hier so", ic:"lemon", c:"#c9931f", cards:[
    {h:"Limon kolonyası", sq:{f:"Nach langer Busfahrt hält dir jemand eine Flasche hin. Was machst du?",o:["Die Hände aufhalten", "Einen Schluck nehmen", "Höflich ablehnen"],r:0,w:"Kolonya wird über die Hände gegossen, nicht getrunken."}, q:"Warum riecht es im Bus plötzlich nach Zitrone?", tr:"Kolonya",
     x:"Zitronenduftendes Kölnischwasser wird Gästen beim Ankommen über die Hände gegossen, im Bus nach langer Fahrt angeboten und an Feiertagen von Haus zu Haus gereicht.",
     tip:"Es ist Begrüßung, Erfrischung und kleine Fürsorge in einem. Ablehnen tut niemand."},
    {h:"Das Geld wandert nach vorn", sq:{f:"Du sitzt hinten im Dolmuş und musst zahlen.",o:["Gib das Geld nach vorn weiter", "Ruf dem Fahrer zu", "Steh auf und geh nach vorn"],r:0,w:"Jeder reicht weiter bis zum Fahrer. Das Wechselgeld kommt denselben Weg zurück."}, q:"Wie bezahlst du im Dolmuş, wenn du ganz hinten sitzt?", tr:"Dolmuş",
     x:"Im Sammeltaxi gibt man sein Geld dem Vordermann, der es weiterreicht bis zum Fahrer. Das Wechselgeld kommt denselben Weg zurück, über fremde Hände, und es kommt an.",
     tip:"Zum Aussteigen reicht ein müsait bir yerde, an einer passenden Stelle bitte."},
    {h:"Die Tasse umdrehen", sq:{f:"Du trinkst deinen Kaffee aus und jemand nimmt dir die Tasse weg.",o:["Sie wird umgedreht und später gedeutet", "Sie wird gespült", "Sie wird nachgefüllt"],r:0,w:"Die Figuren im Satz werden gelesen, meist mit viel Lachen."}, q:"Was liest man aus einer umgedrehten Kaffeetasse?", tr:"Kahve falı",
     x:"Nach dem Kaffee wird die Tasse auf die Untertasse gestülpt, abgekühlt und gedeutet. Die Figuren im Satz werden gelesen wie Wolken.",
     tip:"Niemand glaubt es ganz, und alle hören trotzdem genau zu. Es ist vor allem ein Anlass, zusammenzusitzen."},
    {h:"Decken auf allem", sq:{f:"Woher kommen die gehäkelten Deckchen im Wohnzimmer meistens?",o:["Aus der Aussteuer", "Aus dem Möbelhaus", "Vom Markt in Istanbul"],r:0,w:"Çeyiz, über Jahre vorbereitet und mitgebracht."}, q:"Warum liegen überall gehäkelte Deckchen?", tr:"Dantel ve çeyiz",
     x:"Handgehäkelte Deckchen auf Tischen, Sesselrücken und früher auf dem Fernseher. Vieles davon stammt aus der Aussteuertruhe, die über Jahre gefüllt wurde.",
     tip:"Die Spitze am Rand eines Kopftuchs, oya, hatte früher eine eigene Zeichensprache."},
    {h:"Die Teepause", sq:{f:"Du willst in einem Laden über den Preis reden. Womit fängt es an?",o:["Mit Tee", "Mit der Zahl", "Mit dem Vertrag"],r:0,w:"Tee wird bestellt und geliefert. Geredet wird danach."}, q:"Warum beginnt ein Geschäft mit Tee und nicht mit Zahlen?", tr:"Çay molası",
     x:"Im Laden, in der Werkstatt, im Büro: Tee wird bestellt, geliefert und gemeinsam getrunken. Verhandlungen beginnen damit und enden damit.",
     tip:"Ein Geschäft ohne angebotenen Tee gilt als unhöflich, auch wenn du nichts kaufst."},
    {h:"Aufstehen im Bus", q:"Wann stehst du im Bus auf, ohne gefragt zu werden?", sq:{f:"Eine ältere Frau steigt ein, alle Plätze sind besetzt. Du sitzt.",o:["Du stehst auf und sagst buyurun", "Du wartest, ob sie fragt", "Du schaust aus dem Fenster"],r:0,w:"Aufstehen gilt nicht als Freundlichkeit, sondern als selbstverständlich."}, tr:"Buyurun, siz oturun",
     x:"Steigt jemand Älteres, eine Schwangere oder eine Frau mit Kind ein, stehen jüngere Fahrgäste auf, oft ohne hinzusehen. Gefragt wird nicht, es passiert einfach. Wer sitzen bleibt, bekommt Blicke.",
     tip:"Buyurun heißt hier ungefähr: bitte, nehmen Sie."},
    {h:"Der Teller geht nicht leer zurück", q:"Die Nachbarin bringt dir einen Teller. Was passiert damit?", sq:{f:"Die Nachbarin hat dir Börek auf einem Teller gebracht. Du bringst ihn zurück.",o:["Du legst etwas Eigenes darauf", "Du gibst ihn gespült und leer zurück", "Du behältst den Teller"],r:0,w:"Tabak boş gitmez. Was zurückgeht, trägt etwas mit."}, tr:"Tabak boş gitmez",
     x:"Bekommst du Essen auf einem Teller, gibst du ihn nicht leer zurück. Etwas Eigenes kommt darauf, auch nur Obst, Kekse oder Zucker. Ein leerer Teller gilt als schlechtes Zeichen für das Haus.",
     tip:"Ist gerade nichts da, legt man wenigstens ein paar Bonbons hinein."},
    {h:"Hausschuhe für den Gast", q:"Du klingelst irgendwo. Was steht schon bereit?", sq:{f:"Du kommst in eine Wohnung, an der Tür stehen mehrere Paar Hausschuhe.",o:["Schuhe aus, Terlik an", "Mit Schuhen weitergehen", "In Socken bleiben"],r:0,w:"Für Gäste stehen eigene Terlik bereit, oft in mehreren Größen."}, tr:"Misafir terliği",
     x:"An der Wohnungstür werden Schuhe ausgezogen, und für Gäste stehen eigene Hausschuhe bereit, oft ein ganzer Vorrat in verschiedenen Größen. Barfuß oder in Socken durch die Wohnung zu laufen, mögen viele nicht.",
     tip:"Die guten Gästeterlik sind manchmal nagelneu und nur für Besuch da."},
    {h:"Grüßen im Aufzug", q:"Du steigst zu zwei Fremden in den Aufzug. Was sagst du?", sq:{f:"Du steigst zu zwei fremden Menschen in den Aufzug.",o:["Du grüßt", "Du schaust auf dein Handy", "Du wartest auf den nächsten Aufzug"],r:0,w:"Gegrüßt wird auch unter Fremden, Schweigen wirkt abweisend."}, tr:"Merhaba, kolay gelsin",
     x:"In Aufzug, Treppenhaus und beim Hausmeister wird gegrüßt, auch unter Fremden. Beim Aussteigen sagt man oft noch iyi günler. Schweigen wirkt nicht neutral, sondern abweisend.",
     tip:"Arbeitet jemand gerade, passt kolay gelsin besser als merhaba."},
    {h:"Das Heft beim Krämer", q:"Du hast kein Bargeld dabei und der Laden nimmt keine Karte.", sq:{f:"Dir fehlen zehn Lira und der Bakkal kennt dich vom Sehen.",o:["Er schreibt es ins Heft", "Er legt die Ware zurück", "Er ruft deine Familie an"],r:0,w:"Veresiye defteri, bezahlt wird später, meistens am Monatsende."}, tr:"Veresiye defteri",
     x:"Im Viertelladen gibt es ein Heft, in dem angeschrieben wird. Bezahlt wird später, oft am Monatsende. Es gibt keinen Vertrag, nur den Namen und die Nachbarschaft, die zusieht.",
     tip:"Veresiye kommt von vermek, geben. Gegeben wird auf Vertrauen."},
    {h:"Der Korb am Seil", q:"Vom dritten Stock kommt ein Korb herunter. Warum?", sq:{f:"Ein Korb an einer Schnur hält vor deinem Kopf an, oben ruft jemand.",o:["Du legst das Gekaufte hinein", "Du bindest den Korb los", "Du gehst weiter"],r:0,w:"Geld kommt herunter, die Ware fährt hinauf."}, tr:"Sepet sarkıtmak",
     x:"Wer oben wohnt und nicht hinunter will, lässt einen Korb an einer Schnur zum Simitçi oder zum Laden hinab. Geld fährt hinunter, Brot fährt hinauf. In älteren Vierteln gehört das zum Straßenbild.",
     tip:"Manchmal liegt ein Zettel mit der Bestellung im Korb."},
    {h:"Ein Teller für die Nachbarn", q:"Es wird gekocht und es riecht im ganzen Treppenhaus.", sq:{f:"Du kochst etwas, das im ganzen Haus zu riechen ist.",o:["Ein Teller geht an die Nachbarn", "Du machst das Fenster zu", "Du kochst nachts"],r:0,w:"Komşu payı. Wer riecht, soll auch bekommen."}, tr:"Komşu payı",
     x:"Wird etwas Aufwendiges gekocht, geht ein Teller an die Nachbarn. Das gilt besonders, wenn der Geruch bis ins Treppenhaus zieht, denn niemand soll riechen, was er nicht bekommt.",
     tip:"Bei Schwangeren wird das besonders ernst genommen."},
    {h:"Schuhe bleiben draußen", q:"Warum stehen vor so vielen Türen Schuhe?", sq:{f:"Du betrittst eine Wohnung und niemand sagt etwas zu deinen Schuhen.",o:["Du ziehst sie trotzdem aus", "Du behältst sie an", "Du fragst dreimal nach"],r:0,w:"Gesagt wird es selten, erwartet fast immer."}, tr:"Ayakkabı çıkarmak",
     x:"In der Wohnung wird nicht mit Straßenschuhen gelaufen. Auf dem Boden wird gesessen, gespielt und manchmal gegessen, deshalb bleibt er sauber. Vor vielen Türen stehen deshalb die Schuhe im Treppenhaus.",
     tip:"Kein Gastgeber wird dich bitten, die Schuhe auszuziehen. Erwartet wird es trotzdem."},
    {h:"Der Rest bleibt", q:"Wie gibt man in der Türkei Trinkgeld?", sq:{f:"Die Rechnung macht 88 Lira. Du gibst hundert.",o:["Üstü kalsın", "Bakar mısınız", "Hesap lütfen"],r:0,w:"Gerundet wird großzügig, gerechnet wird nicht."}, tr:"Üstü kalsın",
     x:"Prozente rechnet niemand aus. Man rundet auf und sagt üstü kalsın, der Rest bleibt. Im Teehaus bleiben ein paar Münzen auf dem Tisch, im Restaurant rundet man auf den nächsten glatten Betrag.",
     tip:"Üstü kalsın heißt wörtlich: das Obere soll bleiben."},
    {h:"An einer passenden Stelle", q:"Wie sagst du dem Fahrer, dass du aussteigen willst?", sq:{f:"Du willst aus dem Dolmuş. Was rufst du nach vorn?",o:["Müsait bir yerde", "Buyurun", "Kolay gelsin"],r:0,w:"Feste Haltestellen gibt es nicht, der Fahrer hält, wo es passt."}, tr:"Müsait bir yerde",
     x:"Im Dolmuş gibt es keine festen Haltestellen. Man ruft nach vorn müsait bir yerde, an einer passenden Stelle, und der Fahrer hält, sobald es geht. Kürzer geht auch: inecek var.",
     tip:"Inecek var heißt: hier will jemand aussteigen."},
    {h:"Beim Barbier", q:"Was kommt nach dem Haareschneiden?", sq:{f:"Der Barbier nähert sich deinem Ohr mit einer Flamme.",o:["Er sengt die feinen Härchen ab", "Er desinfiziert die Schere", "Er zündet sich eine Zigarette an"],r:0,w:"Gehört bei vielen Barbieren zum Programm, geht schnell und tut nicht weh."}, tr:"Berber",
     x:"Nach Schnitt und Rasur folgt Kolonya, oft eine kurze Nacken- und Schultermassage, und bei manchen Barbieren werden die feinen Härchen am Ohr mit einer Flamme abgesengt. Dazu gibt es Tee und viel Gespräch.",
     tip:"Beim Gehen sagt man sıhhatler olsun, möge es der Gesundheit dienen."},
    {h:"Handeln auf dem Markt", q:"Wird auf dem Pazar wirklich gehandelt?", sq:{f:"Es ist kurz vor Marktschluss und die Händler rufen laut.",o:["Die Preise gehen herunter", "Der Markt ist ausverkauft", "Es gibt Streit"],r:0,w:"Dönüş, der letzte Durchgang, da wird es billig."}, tr:"Pazarlık",
     x:"Auf dem Wochenmarkt wird gehandelt, aber in Maßen. Gegen Abend rufen die Händler die Preise herunter, das heißt dönüş. Im Laden mit Preisschild wird dagegen nicht gefeilscht.",
     tip:"Ein freundliches biraz indirim yapar mısınız öffnet mehr als harte Zahlen."},
    {h:"Der Mann im Keller", q:"Wer bringt das Brot bis vor die Wohnungstür?", sq:{f:"Vor deiner Wohnungstür steht morgens frisches Brot.",o:["Der Kapıcı war da", "Ein Nachbar hat sich geirrt", "Ein Lieferdienst"],r:0,w:"Brot, Einkäufe und Müll gehen über den Kapıcı."}, tr:"Kapıcı",
     x:"In vielen Wohnhäusern wohnt ein Hausmeister mit seiner Familie im Souterrain. Er bringt Brot und Einkäufe, sammelt den Müll vor der Tür ein, putzt das Treppenhaus und kennt jeden im Haus.",
     tip:"Bezahlt wird monatlich von allen Wohnungen gemeinsam, das heißt aidat."},
    {h:"Tee und Backgammon", q:"Was macht man im Çay bahçesi stundenlang?", sq:{f:"Am Nebentisch wird laut gerufen: şeş beş.",o:["Eine Würfelzahl beim Tavla", "Ein Preis", "Ein Name"],r:0,w:"Die Würfelzahlen haben eigene Namen, şeş beş ist sechs fünf."}, tr:"Tavla",
     x:"Im Teegarten wird Backgammon gespielt, laut und mit viel Kommentar. Dazu Tee in Gläsern, die immer wieder nachgefüllt werden. Bezahlt wird am Ende nach Gläsern, nicht nach Zeit.",
     tip:"Die Würfelzahlen heißen auf Persisch: yek, dü, se, cihar, penc, şeş."}
  ]},
  { t:"Aberglaube", ic:"eye", c:"#1f9b92", cards:[
    {h:"Klopf auf Holz, aber zieh am Ohr", sq:{f:"Jemand spricht etwas Schlimmes laut aus. Was machst du?",o:["Am Ohrläppchen ziehen und auf Holz klopfen", "Nichts sagen", "Das Thema wechseln"],r:0,w:"Erst das Ohr, dann dreimal klopfen und zweimal schnalzen."}, q:"Warum klopft man auf Holz und zieht dabei am Ohr?", tr:"Tahtaya vur, kulağını çek",
     x:"Wenn jemand etwas Schlimmes ausspricht, klopft man dreimal auf Holz, zieht sich am Ohrläppchen und schnalzt zweimal mit der Zunge. Die ganze Folge gehört dazu, nicht nur das Klopfen.",
     tip:"Allah korusun oder Tövbe tövbe wird oft dazu gesagt."},
    {h:"Wasser hinterhergießen", sq:{f:"Du fährst los und hinter dir wird Wasser auf die Straße gegossen.",o:["Ein Wunsch, dass die Reise läuft wie Wasser", "Ein Zeichen, dass du nicht willkommen warst", "Nur Straßenreinigung"],r:0,w:"Su gibi git, su gibi gel. Geh wie Wasser, komm wie Wasser."}, q:"Warum wird hinter einem Reisenden Wasser ausgegossen?", tr:"Arkasından su dökmek",
     x:"Wenn jemand auf eine Reise geht, wird hinter ihm Wasser auf die Straße gegossen. Der Wunsch dahinter: Möge es gehen wie Wasser, leicht und ohne Hindernis.",
     tip:"Du hörst dazu oft: Su gibi git, su gibi gel."},
    {h:"Nicht am Abend", sq:{f:"Es ist dunkel geworden. Was macht man lieber morgen?",o:["Nägel schneiden und hinauskehren", "Kochen", "Telefonieren"],r:0,w:"Nach Sonnenuntergang gibt man auch kein Salz und kein Brot aus dem Haus."}, q:"Was macht man nach Sonnenuntergang besser nicht?", tr:"Akşam yapılmayanlar",
     x:"Nach Sonnenuntergang schneidet man keine Nägel, kehrt nicht den Boden hinaus, gibt kein Salz und kein Brot aus dem Haus. Angeblich geht sonst das Glück mit.",
     tip:"Viele halten sich daran, ohne daran zu glauben. Es ist eher Gewohnheit als Überzeugung."},
    {h:"Brot hebt man auf", sq:{f:"Ein Stück Brot liegt auf dem Boden.",o:["Aufheben, küssen, an die Stirn führen", "Liegen lassen", "In den Müll werfen"],r:0,w:"Brot wird nicht weggeworfen."}, q:"Was passiert mit Brot, das auf den Boden fällt?", tr:"Ekmeğe saygı",
     x:"Brot, das auf dem Boden liegt, wird aufgehoben, geküsst und an die Stirn geführt. Weggeworfen wird es nicht, altes Brot kommt in einen Beutel an den Zaun.",
     tip:"Das ist weniger Aberglaube als tief sitzender Respekt vor Essen, aus Zeiten, in denen es knapp war."},
    {h:"Die Schere nicht in die Hand", sq:{f:"Du brauchst die Schere, die dein Gegenüber gerade hält.",o:["Er legt sie hin, du nimmst sie", "Er gibt sie dir in die Hand", "Er wirft sie dir zu"],r:0,w:"Direkt von Hand zu Hand soll Streit geben."}, q:"Warum reicht dir niemand eine Schere direkt in die Hand?", tr:"Makası elden vermek",
     x:"Scheren und Messer reicht man nicht direkt von Hand zu Hand, sondern legt sie hin. Sonst soll es Streit geben.",
     tip:"Ähnliches gilt für Salz. Wer es direkt überreicht, streitet sich angeblich bald."},
    {h:"Das blaue Auge", sq:{f:"Alle loben dein Baby. Was sagt die Großmutter dazu?",o:["Maşallah", "Teşekkürler", "Hayırlı olsun"],r:0,w:"Maşallah entschärft das Lob, damit es nicht wie Neid klingt."}, q:"Warum kann zu viel Lob gefährlich sein?", tr:"Nazar",
     x:"Zu viel Lob zieht den bösen Blick an, besonders bei Babys und bei guten Nachrichten. Deshalb das blaue Auge an der Wiege, im Auto und am Revers.",
     tip:"Wenn du etwas lobst, häng Maşallah an. Das nimmt dem Lob den Neid."},
    {h:"Juckende Hand, zuckendes Auge", sq:{f:"Deine linke Hand juckt.",o:["Geld kommt", "Geld geht", "Besuch kommt"],r:0,w:"Links kommt, rechts geht. Ernst nimmt es kaum jemand, gesagt wird es trotzdem."}, q:"Deine linke Hand juckt. Was bedeutet das?", tr:"Avuç kaşınması",
     x:"Juckt die linke Hand, kommt Geld. Juckt die rechte, geht Geld. Zuckt das rechte Auge, kommt eine gute Nachricht, beim linken eine schlechte.",
     tip:"Über die Seiten streiten sich die Leute, je nach Region genau andersherum."},
    {h:"Salz gegen den bösen Blick", q:"Was macht man, wenn jemand zu viel gelobt hat?", sq:{f:"Dein Nachbar hat dein Auto überschwänglich gelobt. Deine Oma geht in die Küche.",o:["Sie holt Salz", "Sie kocht Tee", "Sie ruft den Nachbarn an"],r:0,w:"Salz gegen nazar. Ernst genommen und belächelt zugleich."}, tr:"Tuz patlatmak",
     x:"Gegen nazar wird in manchen Familien Salz über dem Feuer geknistert oder in Wasser aufgelöst und weggeschüttet. Dazu wird gemurmelt, von wem das Lob kam. Ernst genommen und belächelt wird es gleichzeitig.",
     tip:"Oft reicht schon ein maşallah im richtigen Moment."},

const LESSON_TARGET = 30;

/* Einheiten zeigen auf ihren Wortschatz und ihren Bonus,
   damit die Reihenfolge der Einheiten frei bleibt. */
const poolOf  = ui => POOL[UNITS[ui].pool != null ? UNITS[ui].pool : ui] || [];
const bonusIx = ui => (UNITS[ui].bonus != null ? UNITS[ui].bonus : -1);
const bonusOf = ui => { const b = bonusIx(ui); return b >= 0 ? BONUS[b] : null; };

function genLessons(){
  UNITS.forEach((u,ui)=>{
    const pool = poolOf(ui); if(!pool || pool.length < 6) return;
    const other = (w, key) => shuffle(pool.filter(x=>x[key] !== w[key])).slice(0,3).map(x=>x[key]);
    const opts = (w, key) => shuffle([w[key], ...other(w, key)]);
    let n = 0;
    while(u.lessons.length < LESSON_TARGET && n + 3 <= pool.length){
      const neu = pool.slice(n, n+3);
      const seen = pool.slice(0, n);
      const rev = [];
      /* Früher stand hier (n*7 + i*17) % seen.length. Da seen.length immer
         gleich n ist, war (n*7) % n stets 0, also kam als Wiederholung immer
         das erste Wort der Einheit. Die Lektionsnummer streut richtig. */
      const k = u.lessons.length;
      for(let i=0; i<3 && seen.length; i++) rev.push(seen[(k*5 + i*7 + 1) % seen.length]);

      const pairs = [], usedTr = {}, usedDe = {};
      [...neu, ...rev, ...pool].forEach(w=>{
        if(pairs.length >= 4 || usedTr[w.tr] || usedDe[w.de]) return;
        usedTr[w.tr] = usedDe[w.de] = 1;
        pairs.push([w.tr, w.de]);
      });

      const items = [
        {k:"choice", de:neu[0].de, tr:neu[0].tr, opts:opts(neu[0],"tr")},
        {k:"choice", de:neu[1].de, tr:neu[1].tr, opts:opts(neu[1],"tr")},
        {k:"listen", tr:neu[2].tr, de:neu[2].de, opts:opts(neu[2],"de")},
        {k:"match", pairs},
        {k:"choice", lbl:"Was heißt das auf Deutsch", de:neu[0].tr, tr:neu[0].de, opts:opts(neu[0],"de")}
      ];
      const r = rev[0] || neu[1];
      items.push({k:"choice", de:r.de, tr:r.tr, opts:opts(r,"tr")});

      u.lessons.push({ t: neu.map(w=>w.tr).join(", "), s:"6 Übungen", items });
      n += 3;
    }
  });
}

/* Wenn die Einheiten umgebaut wurden, stimmen die alten
   Lektionsnummern nicht mehr. Dann wird der Lernfortschritt
   zurückgesetzt, Çay, Serie und Merkliste bleiben. */
function migrate(){
  let changed = false;
  Object.keys(USERS).forEach(k=>{
    const d = USERS[k].data;
    if(d && d.cv !== CONTENT_VERSION){
      d.done = []; d.passed = []; d.bonusDone = []; d.openUnits = null;
      d.cv = CONTENT_VERSION; changed = true;
      /* Vorschauprofile bleiben aufgeschlossen, auch wenn sich
         die Einheiten geändert haben. */
      if(d.preview) unlockAll(d);
    }
  });
  if(ACTIVE && USERS[ACTIVE]) S = Object.assign(fresh(), USERS[ACTIVE].data);
  /* Früher gab es drei erzeugte Klänge, jetzt nur noch den Wald. */
  /* Früher gab es Musik und Naturklang getrennt, jetzt einen Klang. */

    if(S.kVol == null) S.kVol = 25;
    delete S.musik; delete S.mVol; delete S.amb;
    changed = true;
  }
  if(changed) saveAll();
}

      try{ await A.setPersistence(auth, A.browserLocalPersistence); }catch(e){}

        laden: async uid => { const d = await F.getDoc(F.doc(db, "nutzer", uid)); return d.exists() ? d.data() : null; },
        speichern: (uid, daten) => F.setDoc(F.doc(db, "nutzer", uid), daten),

const hoch    = (a,b) => Math.max(a || 0, b || 0);
const vereine = (a,b) => [...new Set([...(a || []), ...(b || [])])];

function wortBesser(x, y){
  if(!x) return y;
  if(!y) return x;
  if((x.b || 0) !== (y.b || 0)) return (x.b || 0) > (y.b || 0) ? x : y;
  if((x.dz || 0) !== (y.dz || 0)) return (x.dz || 0) > (y.dz || 0) ? x : y;
  return (x.due || "") >= (y.due || "") ? x : y;
}

function verschmelzen(lokal, fern){
  if(!fern) return lokal;
  /* Ein leeres Feld auf diesem Gerät darf einen vorhandenen Wert
     aus der Wolke nicht überschreiben. Sonst verliert zum Beispiel
     der Name beim Anmelden auf dem zweiten Gerät seinen Inhalt. */
  const m = Object.assign({}, fern);
  Object.keys(lokal).forEach(k => {
    if(lokal[k] !== null && lokal[k] !== undefined) m[k] = lokal[k];
  });
  m.done      = vereine(lokal.done, fern.done);
  m.passed    = vereine(lokal.passed, fern.passed);
  m.bonusDone = vereine(lokal.bonusDone, fern.bonusDone);
  m.saved     = vereine(lokal.saved, fern.saved);
  m.kg = Object.assign({}, fern.kg || {}, lokal.kg || {});
  m.kr = Object.assign({}, fern.kr || {}, lokal.kr || {});
  m.xp     = hoch(lokal.xp, fern.xp);
  m.streak = hoch(lokal.streak, fern.streak);
  m.pro      = !!(lokal.pro || fern.pro);
  m.tourSeen = !!(lokal.tourSeen || fern.tourSeen);
  m.preview  = !!(lokal.preview || fern.preview);
  m.kmTag = (lokal.kmTag || "") >= (fern.kmTag || "") ? lokal.kmTag : fern.kmTag;

  m.ueb = Object.assign({}, fern.ueb || {});
  Object.keys(lokal.ueb || {}).forEach(k=>{
    const a = lokal.ueb[k], b = m.ueb[k];
    if(!b || (a.tag || "") >= (b.tag || "")) m.ueb[k] = a;
  });

  m.w = Object.assign({}, fern.w || {});
  Object.keys(lokal.w || {}).forEach(k=>{ m.w[k] = wortBesser(lokal.w[k], m.w[k]); });

  /* Der jüngere Tag bringt seinen Tageszähler mit. */
  if((fern.lastDay || "") > (lokal.lastDay || "")){
    m.lastDay = fern.lastDay; m.dayXp = fern.dayXp;
  }
  GERAET_FELDER.forEach(f=>{ if(lokal[f] !== undefined) m[f] = lokal[f]; });
  return m;
}

  const ui = FLAT[i].ui, arr = lessonsOf(ui), pos = arr.indexOf(i);

let _wCache = null, _wStand = "";
function woerter(){
  const schluessel = (ACTIVE || "") + ":" + S.done.length;
  if(_wStand === schluessel && _wCache !== null) return _wCache;
  const set = new Set();
  for(const i of S.done){
    const l = FLAT[i];
    if(!l || !l.items) continue;
    for(const it of l.items) if(it && it.tr) set.add(it.tr);
  }
  _wCache = set.size; _wStand = schluessel;
  return _wCache;
}

/* ---------- Stimmen ----------
   Benutzt die Stimmen des Geräts. Türkisch wird bevorzugt
   weiblich gewählt, wenn das Gerät eine solche Stimme hat.  */
let ttsOk = true, trVoice = null, deVoice = null;
function pickVoices(){
  try{
    const vs = speechSynthesis.getVoices() || [];
    if(!vs.length) return;
    const tr = vs.filter(v=>/^tr/i.test(v.lang));
    const deAll = vs.filter(v=>/^de/i.test(v.lang));
    const fem = /(yelda|filiz|seda|zeynep|ayla|meltem|female|woman|kad[ıi]n)/i;
    const femDe = /(anna|petra|marlene|katja|helena|female|woman)/i;
    trVoice = tr.find(v=>fem.test(v.name)) || tr[0] || null;
    deVoice = deAll.find(v=>femDe.test(v.name)) || deAll[0] || null;
    ttsOk = !!tr.length;
  }catch(e){ ttsOk = false; }
}
try{
  if(window.speechSynthesis){ pickVoices(); speechSynthesis.onvoiceschanged = pickVoices; }
  else ttsOk = false;
}catch(e){ ttsOk = false; }

function speak(text, lang, cb, opt){
  try{
    if(!window.speechSynthesis){ cb && cb(); return; }
    /* Türkisch niemals mit einer deutschen Stimme vorlesen:
       das würde eine falsche Aussprache antrainieren. */
    if(lang !== "de" && !trVoice){ cb && cb(); return; }
    const u = new SpeechSynthesisUtterance(text);
    const f = tempoFaktor();
    if(lang === "de"){ u.lang = "de-DE"; if(deVoice) u.voice = deVoice; u.rate = .95; }
    else { u.lang = "tr-TR"; if(trVoice) u.voice = trVoice; u.rate = .82 * f; }
    if(opt && opt.pitch) u.pitch = opt.pitch;
    u.onend = () => cb && cb();
    u.onerror = () => cb && cb();
    speechSynthesis.speak(u);
  }catch(e){ cb && cb(); }
}
const TEMPI = [[0.72,"langsam"],[1,"normal"],[1.2,"zügig"]];
const tempoFaktor = () => (S && S.hTempo) ? S.hTempo : 1;
function say(text, lang, cb){
  try{ speechSynthesis.cancel(); }catch(e){}
  speak(text, lang || "tr", cb);
}

/* ---------- Echte Aufnahmen ----------
   AUDIO["0-3"] = "data:audio/mp4;base64,...."
   Sobald hier eine Aufnahme liegt, wird sie statt der
   Gerätestimme abgespielt. Fehlt sie, greift die
   Gerätestimme, und fehlt die auch, sagt die App es.      */
const AUDIO = {};
let curAudio = null;
function stopClip(){
  try{ if(curAudio){ curAudio.pause(); curAudio = null; } }catch(e){}
  try{ speechSynthesis.cancel(); }catch(e){}
}
function playClip(key, text, lang, cb, opt){
  const src = AUDIO[key];
  if(src){
    try{
      curAudio = new Audio(src);
      curAudio.onended = () => cb && cb();
      curAudio.onerror = () => speak(text, lang, cb, opt);
      const pr = curAudio.play();
      if(pr && pr.catch) pr.catch(()=>speak(text, lang, cb));
      return;
    }catch(e){}
  }
  speak(text, lang, cb);
}
const canSpeakTr = () => !!trVoice;
const canPlayAudio = () => Object.keys(AUDIO).length > 0 || canSpeakTr();

/* ---------- Töne ----------
   Alles wird im Browser erzeugt, keine Audiodateien.    */
let AC = null;
function ac(){
  try{
    if(!AC){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; AC = new C(); }
    if(AC.state === "suspended") AC.resume();
    return AC;
  }catch(e){ return null; }
}
function tone(freq, start, dur, vol, type){
  const c = ac(); if(!c) return;
  try{
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    const t0 = c.currentTime + start;
    g.gain.setValueAtTime(0.0001, t0);
    const f = Math.max(0.0002, vol * (S.sVol == null ? 70 : S.sVol) / 70);
    g.gain.exponentialRampToValueAtTime(f, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }catch(e){}
}
/* ---------- Hintergrundklang ----------
   Eine Datei, leise im Hintergrund. Der Regler läuft über
   Web Audio, weil iPhones audio.volume schlicht ignorieren. */
const KLANG_DATEI = { wald: "audio/wald.mp3", musik: "audio/musik.mp3" };
let KLANG = null, KSRC = null, KGAIN = null, gesteDa = false;
let klangFrei = false, klangWartet = null;

const klangArt = () => (S.klang == null ? "wald" : S.klang);
const klangVol = () => Math.min(1, Math.max(0, (S.kVol == null ? 25 : S.kVol) / 100));

function klangEl(){
  if(!KLANG){ KLANG = new Audio(); KLANG.loop = true; KLANG.preload = "none"; }
  return KLANG;
}

function klangKette(){
  if(KGAIN) return true;
  const c = ac(); if(!c) return false;
  try{
    KSRC = c.createMediaElementSource(klangEl());
    KGAIN = c.createGain();
    KSRC.connect(KGAIN); KGAIN.connect(c.destination);
    return true;
  }catch(e){ return false; }
}

function klangLaut(){
  const v = klangVol();
  if(KGAIN){
    try{ KGAIN.gain.value = v; }catch(e){}
    try{ if(KLANG) KLANG.volume = 1; }catch(e){}
  } else {
    try{ if(KLANG) KLANG.volume = v; }catch(e){}
  }
}

function klangAus(){ try{ if(KLANG) KLANG.pause(); }catch(e){} }

function klangAn(){
  const art = klangArt();
  if(art === "aus"){ klangAus(); return; }
  const datei = KLANG_DATEI[art];
  if(!datei) return;
  /* Die Klangdatei ist über zwei Megabyte groß. Wer von Instagram kommt,
     kurz hineinschaut und wieder geht, soll dafür kein Datenvolumen zahlen.
     Darum wird sie erst geholt, wenn jemand die App angefasst hat und
     auch eine Weile geblieben ist. Wer den Klang selbst einschaltet,
     bekommt ihn sofort. */
  if(!gesteDa) return;
  if(!klangFrei){
    if(!klangWartet){
      klangWartet = setTimeout(() => { klangWartet = null; klangFrei = true; klangAn(); }, 15000);
    }
    return;
  }
  const el = klangEl();
  if(!el.src || el.src.indexOf(datei) < 0){ el.src = datei; }
  klangKette();
  klangLaut();
  try{ const c = ac(); if(c && c.state === "suspended") c.resume(); }catch(e){}
  try{ const pr = el.play(); if(pr && pr.catch) pr.catch(()=>{}); }catch(e){}
}

function klangWaehle(art){
  S.klang = art; save();
  klangFrei = true;
  if(klangWartet){ clearTimeout(klangWartet); klangWartet = null; }
  if(art === "aus") klangAus(); else klangAn();
}

function ersteGeste(){
  if(gesteDa) return;
  gesteDa = true;
  klangAn();
}
try{
  document.addEventListener("pointerdown", ersteGeste, {once:true});
  document.addEventListener("keydown", ersteGeste, {once:true});
}catch(e){}

const KLANGWAHL = [["wald","leaf","Wald"],["musik","note","Musik"],["aus","mute","Aus"]];

function sfx(kind){
  if(!S.sound) return;
  if(kind === "right"){ tone(784, 0, .08, .08); tone(1175, .06, .10, .07); }
  else if(kind === "wrong"){ tone(196, 0, .14, .09, "triangle"); }
  else if(kind === "done"){ [523,659,784,1047].forEach((f,i)=>tone(f, i*.085, .22, .11)); }
  else if(kind === "pass"){ [523,659,784,1047,1319].forEach((f,i)=>tone(f, i*.09, .3, .12)); }
  else if(kind === "fail"){ tone(330, 0, .2, .11, "triangle"); tone(247, .15, .3, .10, "triangle"); }
  else if(kind === "save"){ tone(988, 0, .08, .09); }
}

/* ---------- 3b. PROFILE ---------- */
/* Der Einstieg läuft über das Konto, nicht mehr über einen bloßen
   Benutzernamen. Wer nur schauen will, kommt über die Probe hinein.
   Alte Profile ohne Konto bleiben erreichbar, damit niemand
   seinen Fortschritt verliert. */
function authScreen(mode, hinweis){
  if(mode === "new") return kontoScreen("neu");
  const alte = Object.keys(USERS).filter(k => k !== "__gast" && k !== PROBE_SCHL
                                           && String(k).indexOf("cloud_") !== 0);

  app.innerHTML = `<div class="auth">
    <img class="logo big" src="img/logo-256.png" alt="Typisch Türkisch">
    <h1 class="brand" style="text-align:center">Typisch <span class="tr">Türkisch</span></h1>
    <p class="lead">Türkisch lernen und verstehen, wie in der Türkei wirklich gelebt wird.</p>

    <div class="field"><label>E-Mail</label>
      <input id="mail" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="name@mail.de"></div>
    <div class="field"><label>Passwort</label>
      <input id="pw" type="password" autocomplete="current-password"></div>
    <div class="err" id="e">${esc(hinweis || "")}</div>
    <button class="cta" id="go">Anmelden</button>

    <div class="switchline" style="margin-top:12px"><button id="vergessen">Passwort vergessen</button></div>
    <div class="switchline" style="margin-top:16px">Noch kein Konto? <button id="toNew">Konto erstellen</button></div>
    <div class="switchline" style="margin-top:16px"><button id="guest">Erst einmal ohne Profil hineinschauen</button></div>

    ${alte.length ? `<div class="switchline" style="margin-top:24px">
      <button id="toAlt">Auf diesem Gerät gibt es ${alte.length === 1 ? "ein Profil" : alte.length + " Profile"} ohne Konto</button></div>` : ""}

    <div class="switchline" style="margin-top:16px"><button id="rechtlink">Impressum und Datenschutz</button></div>
  </div>`;

  const g = id => document.getElementById(id);
  g("toNew").onclick = () => kontoScreen("neu");
  g("rechtlink").onclick = () => rechtScreen("impressum");
  g("guest").onclick = () => {
    ACTIVE = PROBE_SCHL; S = fresh(); S.tourSeen = true;
    try{ localStorage.removeItem(AKEY); }catch(e){}
    enterApp();
  };
  if(g("toAlt")) g("toAlt").onclick = () => alteProfile();

  g("vergessen").onclick = async () => {
    const mail = (g("mail").value || "").trim();
    if(!mail){ g("e").textContent = "Trag zuerst deine E-Mail ein."; return; }
    await wolkeLaden();
    if(!wolkeDa()){ g("e").textContent = "Keine Verbindung. Versuch es später noch einmal."; return; }
    try{
      await CLOUD.passwortMail(mail);
      g("e").style.color = "var(--green-dark)";
      g("e").textContent = "Wir haben dir eine E-Mail geschickt.";
    }catch(err){ g("e").textContent = kontoFehler(err); }
  };

  g("go").onclick = async () => {
    const mail = (g("mail").value || "").trim(), pw = g("pw").value || "";
    if(!mail || mail.indexOf("@") < 0){ g("e").textContent = "Bitte eine gültige E-Mail eintragen."; return; }
    if(!pw){ g("e").textContent = "Bitte dein Passwort eintragen."; return; }
    g("go").disabled = true; g("go").textContent = "Wird angemeldet";
    await wolkeLaden();
    if(!wolkeDa()){
      g("go").disabled = false; g("go").textContent = "Anmelden";
      g("e").textContent = "Keine Verbindung zum Server. Ohne Netz kannst du unten ohne Profil hineinschauen.";
      return;
    }
    try{
      const r = await CLOUD.anmelden(mail, pw);
      await kontoVerbinden(r.user);
      enterApp();
    }catch(err){
      g("go").disabled = false; g("go").textContent = "Anmelden";
      g("e").textContent = kontoFehler(err);
    }
  };
}

/* Profile aus der Zeit vor den Konten */
function alteProfile(){
  const alte = Object.keys(USERS).filter(k => k !== "__gast" && k !== PROBE_SCHL
                                           && String(k).indexOf("cloud_") !== 0);
  app.innerHTML = `<div class="auth">
    <h1 class="brand" style="text-align:center">Profile auf diesem Gerät</h1>
    <p class="lead">Diese Profile liegen nur hier und sind an kein Konto gebunden.
    Wenn du dir ein Konto anlegst, während ein Profil geöffnet ist, nimmt das Konto den Fortschritt mit.</p>
    <div class="known">${alte.map(k => `
      <button data-pick="${esc(k)}">
        <span class="ava">${esc((USERS[k].name[0] || "?").toUpperCase())}</span>
        <span><b>${esc(USERS[k].name)}</b><small>${USERS[k].data.done.length} Lektionen, ${USERS[k].data.xp} Çay</small></span>
      </button>`).join("")}</div>
    <div class="switchline" style="margin-top:18px"><button id="zurueck">Zurück zur Anmeldung</button></div>
  </div>`;
  document.getElementById("zurueck").onclick = () => authScreen("login");
  app.querySelectorAll("[data-pick]").forEach(b => {
    b.onclick = () => pinScreen(b.dataset.pick);
  });
}

function pinScreen(key){
  const u = USERS[key];
  if(!u.pin){ ACTIVE = key; S = Object.assign(fresh(), u.data); saveAll(); enterApp(); return; }
  app.innerHTML = `<div class="auth">
    <h1 class="brand">Hallo ${esc(u.name)}</h1>
    <p class="lead">Gib deine vierstellige PIN ein.</p>
    <div class="field"><label>PIN</label>
      <input id="p" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="••••"></div>
    <div class="err" id="e"></div>
    <button class="cta" id="go">Weiter</button>
    <div class="switchline" style="margin-top:18px"><button id="back">Anderes Profil</button></div>
  </div>`;
  const g = id => document.getElementById(id);
  g("p").focus();
  g("go").onclick = () => {
    if((g("p").value||"").trim() !== u.pin){ g("e").textContent = "Die PIN stimmt nicht."; return; }
    ACTIVE = key; S = Object.assign(fresh(), u.data); saveAll(); enterApp();
  };
  g("back").onclick = () => authScreen("login");
}

function profileSheet(){
  const el = document.createElement("div");
  el.className = "sheet";
  const names = Object.keys(USERS).filter(k => k !== ACTIVE && k !== "__gast" && k !== PROBE_SCHL);
  el.innerHTML = `<div class="inner">
    <h3>${istProbe() ? "Ohne Profil" : esc(displayName())}</h3>
    <p class="who">${S.done.length} von ${TOTAL} Lektionen, ${S.xp} Çay, ${tage(S.streak)} Serie</p>
    ${names.map(k=>`<button class="row" data-sw="${esc(k)}">
        <span class="ava sm">${esc((USERS[k].name[0]||"?").toUpperCase())}</span>
        <span>Zu ${esc(USERS[k].name)} wechseln</span></button>`).join("")}
    <div class="vol">
      <div class="volhead"><span class="vlab">Hintergrundklang</span><b id="kVal">${klangArt()==="aus" ? "aus" : (S.kVol==null?25:S.kVol)+" Prozent"}</b></div>
      <div class="klangwahl">${KLANGWAHL.map(([k,ic,l])=>`<button class="${klangArt()===k?"on":""}" data-klang="${k}">${svgIcon(ic,"mini")} ${l}</button>`).join("")}</div>
      <input type="range" id="kVol" min="0" max="100" step="5" value="${S.kVol==null?25:S.kVol}" ${klangArt()==="aus"?"disabled":""} aria-label="Lautstärke des Hintergrundklangs">
    </div>
    <div class="vol">
      <div class="volhead"><button id="tgSound">${S.sound?svgIcon("phones","mini"):svgIcon("mute","mini")} Töne in den Übungen</button><b id="sVal">${S.sound ? (S.sVol==null?70:S.sVol)+" Prozent" : "aus"}</b></div>
      <input type="range" id="sVol" min="0" max="100" step="5" value="${S.sVol==null?70:S.sVol}" ${S.sound?"":"disabled"} aria-label="Lautstärke der Töne">
    </div>
    <button class="row" id="tgVoice"><span class="ava sm" style="background:var(--surface);color:var(--muted)">${S.voice?svgIcon("mic","mini"):svgIcon("mute","mini")}</span><span>Türkische Stimme ${S.voice?"an":"aus"}</span></button>
    ${istProbe() ? "" : `<button class="row" id="backup"><span class="ava sm" style="background:var(--surface);color:var(--muted)">${svgIcon("disk","mini")}</span><span>Fortschritt sichern oder laden</span></button>`}
    <button class="row" id="voiceHelp"><span class="ava sm" style="background:var(--surface);color:var(--muted)">${svgIcon("quest","mini")}</span><span>${canSpeakTr()?"Türkische Stimme ist installiert":"Türkische Stimme einrichten"}</span></button>
    <button class="row" id="konto"><span class="ava sm" style="background:var(--surface);color:var(--muted)">${svgIcon("disk","mini")}</span><span>${KONTO ? "Konto: " + esc(KONTO.email || "") : "Konto, auf allen Geräten"}</span></button>
    <button class="row" id="merk"><span class="ava sm" style="background:var(--surface);color:var(--muted)">${svgIcon("scroll","mini")}</span><span>Merkliste, ${S.saved.length}</span></button>
    ${istProbe() ? "" : `<button class="row" id="umben"><span class="ava sm" style="background:var(--surface);color:var(--muted)">${svgIcon("mic","mini")}</span><span>Namen ändern</span></button>`}
    <button class="row" id="recht"><span class="ava sm" style="background:var(--surface);color:var(--muted)">${svgIcon("scroll","mini")}</span><span>Impressum, Datenschutz, Widerruf</span></button>
    <button class="row" id="tour"><span class="ava sm" style="background:var(--surface);color:var(--muted)">${svgIcon("route","mini")}</span><span>Rundgang noch einmal ansehen</span></button>
    <button class="row" data-sw="__new__"><span class="ava sm">+</span><span>Neues Profil</span></button>
    <button class="row" id="out"><span class="ava sm" style="background:var(--surface);color:var(--muted)">${svgIcon("exit","mini")}</span><span>${istProbe() ? "Probe beenden" : "Abmelden"}</span></button>
    <p class="note">${istProbe()
      ? "Du schaust ohne Profil hinein. Nichts wird gespeichert, beim nächsten Öffnen fängst du wieder von vorn an."
      : (KONTO
        ? "Dein Fortschritt ist gesichert und steht auf jedem Gerät zur Verfügung, auf dem du dich anmeldest."
        : "Dein Fortschritt liegt auf diesem Gerät. Mit einem Konto kannst du auf einem anderen Handy weiterlernen.")}<br>
      © 2026 Gözde Özler · Stand ${BUILD} · ${TOTAL} Lektionen · ${BONUS.reduce((n,b)=>n+b.cards.length,0)} Sprichwörter · ${KULTUR.reduce((n,k)=>n+k.cards.length,0)} Kulturtexte</p>
    <button class="cta ghost" id="close">Schließen</button>
  </div>`;
  document.body.appendChild(el);
  const kill = () => el.remove();
  el.onclick = e => { if(e.target === el) kill(); };
  el.querySelector("#close").onclick = kill;
  el.querySelector("#tgSound").onclick = () => { S.sound = !S.sound; save(); if(S.sound) sfx("save"); kill(); profileSheet(); };
  const mr = el.querySelector("#kVol"), sr = el.querySelector("#sVol");
  if(mr) mr.oninput = () => { S.kVol = +mr.value; klangLaut(); save();
    el.querySelector("#kVal").textContent = S.kVol + " Prozent"; };
  el.querySelectorAll("[data-klang]").forEach(bq=>{
    bq.onclick = () => { klangWaehle(bq.dataset.klang); kill(); profileSheet(); };
  });
  if(sr){
    sr.oninput = () => { S.sVol = +sr.value; save();
      el.querySelector("#sVal").textContent = S.sVol + " Prozent"; };
    sr.onchange = () => { if(S.sound) sfx("right"); };
  }
  el.querySelector("#tgVoice").onclick = () => { S.voice = !S.voice; save(); kill(); profileSheet(); };

  el.querySelector("#voiceHelp").onclick = () => { kill(); voiceHelpScreen(); };
  const bk = el.querySelector("#backup");
  if(bk) bk.onclick = () => { kill(); backupScreen(); };
  el.querySelector("#tour").onclick = () => { kill(); tourScreen(0); };
  el.querySelector("#merk").onclick = () => { kill(); savedScreen(); };
  el.querySelector("#konto").onclick = () => { kill(); kontoScreen(); };
  el.querySelector("#recht").onclick = () => { kill(); rechtScreen("impressum"); };
  const ub = el.querySelector("#umben");
  if(ub) ub.onclick = () => { kill(); nameScreen(); };
  el.querySelector("#out").onclick = () => { saveAll(); ACTIVE = null; S = fresh(); saveAll(); kill(); authScreen("login"); };
  el.querySelectorAll("[data-sw]").forEach(b=>{
    b.onclick = () => {
      saveAll(); kill();
      if(b.dataset.sw === "__new__") authScreen("new"); else pinScreen(b.dataset.sw);
    };
  });
}

function enterApp(){
  klangAn();
  if(!S.tourSeen) return tourScreen(0);
  if(nameFehlt()) return nameScreen();
  home();
}

function tourScreen(i){
  const c = TOUR[i], last = i === TOUR.length - 1;
  app.innerHTML = `<div class="tour">
    <div class="tourtop">
      <button class="tskip" id="skip">${last ? "" : "Überspringen"}</button>
    </div>
    <div class="tourmid">
      <div class="touric" style="background:${c.c}1f;color:${c.c}">${svgIcon(c.ic)}</div>
      <h2>${esc(c.t)}</h2>
      <p>${esc(c.x)}</p>
    </div>
    <div class="tourbot">
      <div class="dots">${TOUR.map((_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</div>
      <button class="cta red" id="next">${last ? "Los geht es" : "Weiter"}</button>
    </div>
  </div>`;
  const done = () => { S.tourSeen = true; save(); home(); };
  const sk = document.getElementById("skip");
  if(sk) sk.onclick = done;
  document.getElementById("next").onclick = () => { if(last) done(); else tourScreen(i + 1); };
}


/* ---------- 3b2. KONTOBILDSCHIRM ---------- */
function kontoScreen(modus, hinweis){
  /* Firebase kommt erst jetzt dazu, nicht beim Oeffnen der Seite. */
  if(!window.CLOUD){
    app.innerHTML = topbar() + `<div class="auth">
      <h1 class="brand">Konto</h1>
      <p class="lead">Einen Moment</p></div>`;
    const c = document.getElementById("chip"); if(c) c.onclick = profileSheet;
    wolkeLaden().then(() => {
      if(wolkeDa() && !KONTO) wolkeStarten();
      kontoScreen(modus, hinweis);
    });
    return;
  }
  /* Nach dem Neuladen braucht die Anmeldung einen Augenblick.
     Wer angemeldet war, soll nicht kurz das Anmeldeformular sehen. */
  if(wolkeDa() && !KONTO && ACTIVE && String(ACTIVE).indexOf("cloud_") === 0 && !kontoWartet){
    kontoWartet = true;
    app.innerHTML = topbar() + `<div class="auth">
      <h1 class="brand">Dein Konto</h1>
      <p class="lead">Einen Moment</p></div>`;
    const c0 = document.getElementById("chip"); if(c0) c0.onclick = profileSheet;
    let n = 0;
    const warte = setInterval(() => {
      if(KONTO || ++n > 24){ clearInterval(warte); kontoWartet = false; kontoScreen(modus, hinweis); }
    }, 250);
    return;
  }
  const m = modus || (KONTO ? "stand" : "anmelden");
  if(!wolkeDa()){
    app.innerHTML = topbar() + `<div class="auth">
      <h1 class="brand">Konto</h1>
      <p class="lead">Die Verbindung zum Server lässt sich gerade nicht aufbauen. Dein Fortschritt bleibt auf diesem Gerät gespeichert und geht nicht verloren. Versuch es später noch einmal.</p>
      <button class="cta ghost" id="back">Zurück</button>
    </div>`;
    document.getElementById("back").onclick = home;
    document.getElementById("chip").onclick = profileSheet;
    return;
  }

  if(m === "stand" && KONTO){
    app.innerHTML = topbar() + `<div class="auth">
      <h1 class="brand">Dein Konto</h1>
      <p class="lead">Angemeldet als <b>${esc(KONTO.email || "")}</b>. Dein Fortschritt wird gesichert und steht auf jedem Gerät zur Verfügung, auf dem du dich anmeldest.</p>
      <div class="field" style="margin-top:4px">
        <label>Letzter Abgleich</label>
        <div class="kstand">${syncStand === "ok" ? "Alles gesichert" : (syncStand === "offen" ? "Noch nicht übertragen, wird nachgeholt" : "Noch nichts übertragen")}</div>
      </div>
      <button class="cta" id="jetzt">Jetzt abgleichen</button>
      <div class="err" id="e">${esc(hinweis || "")}</div>
      <div class="switchline" style="margin-top:18px"><button id="raus">Abmelden</button></div>
      <div class="switchline" style="margin-top:10px"><button id="weg">Konto und Daten löschen</button></div>
      <div class="switchline" style="margin-top:10px"><button id="back">Zurück</button></div>
    </div>`;
    const g = id => document.getElementById(id);
    g("chip").onclick = profileSheet;
    g("back").onclick = home;
    g("jetzt").onclick = async () => {
      g("jetzt").disabled = true; g("jetzt").textContent = "Wird abgeglichen";
      const ok = await wolkeHolen();
      kontoScreen("stand", ok ? "" : "Das hat nicht geklappt. Bist du online?");
    };
    g("raus").onclick = async () => {
      try{ await CLOUD.abmelden(); }catch(e){}
      KONTO = null; syncStand = "";
      ACTIVE = null; S = fresh(); saveAll();
      authScreen("login");
    };
    g("weg").onclick = () => kontoLoeschenFragen();
    return;
  }

  const neu = m === "neu";
  app.innerHTML = topbar() + `<div class="auth">
    <h1 class="brand">${neu ? "Konto erstellen" : "Anmelden"}</h1>
    <p class="lead">${neu
      ? "Mit einem Konto liegt dein Fortschritt nicht nur auf diesem Gerät. Wechselst du das Handy, ist alles wieder da."
      : "Melde dich an, dann holt die App deinen Fortschritt zurück."}</p>
    ${neu ? `<div class="field"><label>Wie sollen wir dich nennen</label>
      <input id="nick" autocomplete="nickname" maxlength="20" placeholder="z.B. Lena"></div>` : ""}
    <div class="field"><label>E-Mail</label>
      <input id="mail" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="name@mail.de"></div>
    <div class="field"><label>Passwort${neu ? ", mindestens sechs Zeichen" : ""}</label>
      <input id="pw" type="password" autocomplete="${neu ? "new-password" : "current-password"}"></div>
    <div class="err" id="e">${esc(hinweis || "")}</div>
    <button class="cta" id="go">${neu ? "Konto erstellen" : "Anmelden"}</button>
    <div class="switchline" style="margin-top:14px">
      ${neu ? `Schon ein Konto? <button id="um">Anmelden</button>`
            : `Noch kein Konto? <button id="um">Konto erstellen</button>`}
    </div>
    ${neu ? "" : `<div class="switchline" style="margin-top:10px"><button id="vergessen">Passwort vergessen</button></div>`}
    <div class="switchline" style="margin-top:18px"><button id="back">Ohne Konto weiter</button></div>
  </div>`;

  const g = id => document.getElementById(id);
  g("chip").onclick = profileSheet;
  g("back").onclick = () => { if(ACTIVE && USERS[ACTIVE]) home(); else authScreen("login"); };
  g("um").onclick = () => kontoScreen(neu ? "anmelden" : "neu");
  const vg = g("vergessen");
  if(vg) vg.onclick = async () => {
    const mail = (g("mail").value || "").trim();
    if(!mail){ g("e").textContent = "Trag zuerst deine E-Mail ein."; return; }
    try{
      await CLOUD.passwortMail(mail);
      g("e").style.color = "var(--green-dark)";
      g("e").textContent = "Wir haben dir eine E-Mail geschickt.";
    }catch(err){ g("e").textContent = kontoFehler(err); }
  };
  g("go").onclick = async () => {
    const mail = (g("mail").value || "").trim();
    const pw   = g("pw").value || "";
    const nick = neu ? (g("nick").value || "").trim() : "";
    if(neu && nick.length < 2){ g("e").textContent = "Bitte einen Namen mit mindestens zwei Zeichen."; return; }
    if(!mail || mail.indexOf("@") < 0){ g("e").textContent = "Bitte eine gültige E-Mail eintragen."; return; }
    if(pw.length < 6){ g("e").textContent = "Das Passwort braucht mindestens sechs Zeichen."; return; }
    g("go").disabled = true;
    g("go").textContent = neu ? "Wird erstellt" : "Wird angemeldet";
    try{
      const r = neu ? await CLOUD.registrieren(mail, pw) : await CLOUD.anmelden(mail, pw);
      await kontoVerbinden(r.user, nick);
      enterApp();
    }catch(err){
      g("go").disabled = false;
      g("go").textContent = neu ? "Konto erstellen" : "Anmelden";
      g("e").textContent = kontoFehler(err);
    }
  };
}

/* Loeschen ist nicht rueckholbar, darum einmal nachfragen. */
function kontoLoeschenFragen(){
  const el = document.createElement("div");
  el.className = "sheet";
  el.innerHTML = `<div class="inner">
    <h3>Konto wirklich löschen</h3>
    <p class="who">Deine E-Mail-Adresse und dein gesamter Lernfortschritt werden entfernt.
    Das lässt sich nicht zurückholen.</p>
    <button class="cta" id="doch" style="background:#c01616">Ja, alles löschen</button>
    <div class="err" id="e"></div>
    <button class="cta ghost" id="nein">Abbrechen</button>
  </div>`;
  document.body.appendChild(el);
  const kill = () => el.remove();
  el.onclick = e => { if(e.target === el) kill(); };
  el.querySelector("#nein").onclick = kill;
  el.querySelector("#doch").onclick = async () => {
    const b = el.querySelector("#doch");
    b.disabled = true; b.textContent = "Wird gelöscht";
    try{
      await CLOUD.loeschen(KONTO.uid);
      const weg = ACTIVE;
      KONTO = null; syncStand = "";
      if(weg && USERS[weg]) delete USERS[weg];
      ACTIVE = null; S = fresh(); saveAll();
      kill(); authScreen("login");
    }catch(err){
      b.disabled = false; b.textContent = "Ja, alles löschen";
      const c = (err && err.code) || "";
      el.querySelector("#e").textContent = c.indexOf("requires-recent-login") >= 0
        ? "Aus Sicherheitsgründen bitte einmal abmelden, neu anmelden und es dann noch einmal versuchen."
        : kontoFehler(err);
    }
  };
}

function kontoFehler(err){
  const c = (err && err.code) || "";
  if(c.indexOf("email-already-in-use") >= 0) return "Zu dieser E-Mail gibt es schon ein Konto. Melde dich an.";
  if(c.indexOf("invalid-email") >= 0)        return "Diese E-Mail sieht nicht richtig aus.";
  if(c.indexOf("weak-password") >= 0)        return "Das Passwort ist zu kurz.";
  if(c.indexOf("user-not-found") >= 0 || c.indexOf("invalid-credential") >= 0 || c.indexOf("wrong-password") >= 0)
    return "E-Mail oder Passwort stimmt nicht.";
  if(c.indexOf("too-many-requests") >= 0)    return "Zu viele Versuche. Warte einen Moment.";
  if(c.indexOf("network") >= 0)              return "Keine Verbindung. Bist du online?";
  return "Das hat nicht geklappt. Versuch es noch einmal.";
}

/* ---------- 4a0. FORTSCHRITT SICHERN ----------
   Der Fortschritt liegt im Browser, also an einer Adresse
   auf einem Gerät. Mit diesem Code lässt er sich auf ein
   anderes Gerät oder nach einem gelöschten Browser
   zurückholen.                                            */
function makeCode(){
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify({u:USERS, a:ACTIVE})))); }
  catch(e){ return ""; }
}
function readCode(txt){
  try{
    const o = JSON.parse(decodeURIComponent(escape(atob(txt.trim()))));
    if(!o || typeof o.u !== "object") return null;
    return o;
  }catch(e){ return null; }
}

/* Ein Kulturstück je Tag, für alle gleich gemischt nach Datum. */
const kSchl   = (ti,ci) => ti + "-" + ci;
const kGelesen = (ti,ci) => !!(S.kr && S.kr[kSchl(ti,ci)]);
/* Ein Thema öffnet sich, wenn vom Thema davor genug verstanden ist. */
const K_SCHWELLE = 0.7;
function kThemaFertig(ti){
  const th = KULTUR[ti]; if(!th) return false;
  const g = th.cards.filter((c,ci)=>kFertig(ti,ci)).length;
  return g >= Math.ceil(th.cards.length * K_SCHWELLE);
}
const kThemaOffen = ti => ti === 0 || kThemaFertig(ti-1);
function kLesen(ti,ci){
  if(!S.kr) S.kr = {};
  if(!S.kr[kSchl(ti,ci)]){ S.kr[kSchl(ti,ci)] = true; save(); }
}
const kFertig = (ti,ci) => !!(S.kg && S.kg[kSchl(ti,ci)]);
function kZahl(){
  let g = 0, n = 0;
  KULTUR.forEach((th,ti)=>th.cards.forEach((c,ci)=>{ n++; if(kFertig(ti,ci)) g++; }));
  return { g, n };
}

function kulturHeute(tag){
  const alle = [];
  KULTUR.forEach((th, ti) => {
    if(!kThemaOffen(ti)) return;          /* nur aus offenen Themen */
    th.cards.forEach((c, ci) => alle.push({ ti, ci }));
  });
  if(!alle.length) return null;
  /* Was noch offen ist, kommt zuerst dran. */
  const offen = alle.filter(a => !kFertig(a.ti, a.ci));
  const quelle = offen.length ? offen : alle;
  const t = tag || todayStr();
  /* Tage durchzaehlen statt Zufall: so wiederholt sich nichts,
     bevor alles einmal dran war. */
  const tage = Math.floor((new Date(t + "T00:00:00").getTime()
                           - new Date("2026-01-01T00:00:00").getTime()) / 86400000);
  const n = ((tage % quelle.length) + quelle.length) % quelle.length;
  return quelle[n];
}

      </button>`;}).join("")}
    </div>
    <div style="height:20px"></div>`;
  document.getElementById("chip").onclick = profileSheet;
  wireReiter();
  const c = document.getElementById("cont");
  if(c) c.onclick = () => kulturRead(m.t, m.c);

        if(!S.kg[kSchl(ti,ci)]){ S.kg[kSchl(ti,ci)] = true; addXp(15); }
      }
      save();
    };
  });
  app.querySelectorAll("[data-mk]").forEach(b=>{
    b.onclick = () => {
      const ci = +b.dataset.mk;
      if(S.mark && S.mark.t===ti && S.mark.c===ci) S.mark = null;
      else { S.mark = {t:ti, c:ci}; sfx("save"); }
      save(); kulturRead(ti, ci);
    };
  });
  klangAn();
  /* Was wirklich auf dem Schirm war, gilt als gelesen. */
  try{
    const beob = new IntersectionObserver(eintraege=>{
      eintraege.forEach(e=>{
        if(e.isIntersecting){
          const ci = +e.target.id.replace("sec","");
          kLesen(ti, ci);
          beob.unobserve(e.target);
        }
      });
    }, { threshold: 0.35 });
    app.querySelectorAll(".sec").forEach(el => beob.observe(el));
  }catch(e){
    th.cards.forEach((c,ci)=>kLesen(ti,ci));
  }
  if(scrollTo !== null && scrollTo !== undefined){
    const el = document.getElementById("sec"+scrollTo);
    if(el) setTimeout(()=>el.scrollIntoView({block:"start"}), 60);
  }
}

/* ---------- 4b3. VERSTEHST DU TÜRKISCH? ----------
   Eigene Runde aus den Situationen der Kulturecke. Nicht
   die Übersetzung wird gefragt, sondern was gemeint ist. */
const VST_N = 6;
let V = null;

/* Gefragt wird nur, was in der Kulturecke schon erklärt wurde. */
function vstAlle(){
  const out = [];
  KULTUR.forEach((th, ti) => th.cards.forEach((c, ci) => {
    if(c.sq && kGelesen(ti, ci)) out.push({ ti, ci });
  }));
  return out;
}
function vstGesamt(){
  let n = 0;
  KULTUR.forEach(th => th.cards.forEach(c => { if(c.sq) n++; }));
  return n;
}
const vstOffen = () => vstAlle().filter(a => !kFertig(a.ti, a.ci));

function vstScreen(){
  const offen = vstOffen().length, da = vstAlle().length, g = vstGesamt();
  const verstanden = da - offen;
  const pz = g ? Math.round(da / g * 100) : 0;
  app.innerHTML = topbar() + reiter("vst") + `
    <div class="hero">
      <h1>Verstehst du Türkisch?</h1>
      <p>Eine kurze Szene, und du entscheidest, was gemeint ist. Nicht die Übersetzung zählt, sondern was die Person damit sagen will.</p>
    </div>
    <div class="fswrap">
      <div class="fscard">
        ${balken("Freigeschaltet", da, g, "var(--gold)")}
        ${balken("Verstanden", verstanden, g, "var(--green)")}
        <p class="fsnote">Eine Situation kommt erst, wenn du das Stück in der Kulturecke gelesen hast. So wird nie gefragt, was dir noch niemand erklärt hat.</p>
      </div>
      ${da ? `<button class="cta red" id="go" style="margin-top:16px">${offen ? "Runde starten" : "Noch eine Runde"}</button>`
           : `<button class="cta red" id="zukultur" style="margin-top:16px">Zur Kulturecke</button>`}
      ${da ? `<p class="fsend">${offen ? offen + " von " + da + " freigeschalteten Situationen sind noch offen." : "Du hattest alle freigeschalteten Situationen schon richtig. Lies weiter in der Kulturecke, dann kommen neue dazu."}</p>`
           : `<p class="fsend">Lies zuerst ein Stück in der Kulturecke. Danach wartet hier die passende Situation.</p>`}
    </div>`;
  document.getElementById("chip").onclick = profileSheet;
  wireReiter();
  const go = document.getElementById("go");
  if(go) go.onclick = startVst;
  const zk = document.getElementById("zukultur");
  if(zk) zk.onclick = kulturScreen;
}

function startVst(){
  const offen = vstOffen(), alle = vstAlle();
  const quelle = offen.length ? offen : alle;
  if(!quelle.length){ home(); return; }
  V = { liste: shuffle(quelle.slice()).slice(0, Math.min(VST_N, quelle.length)),
        i: 0, richtig: 0, xp: 0, t0: Date.now(), antwort: null };
  vstRender();
}

function vstRender(){
  const a = V.liste[V.i];
  if(!a) return vstResult();
  const th = KULTUR[a.ti], c = th.cards[a.ci], sq = c.sq;
  const fertig = V.antwort !== null;
  const ok = fertig && V.antwort === sq.r;
  app.innerHTML = `<div class="lessbar">
      <button class="x" id="quit">✕</button>
      <div class="bar"><i style="width:${Math.round(V.i / V.liste.length * 100)}%"></i></div>
      <div class="stat gem">${svgIcon("eye")}${V.i + 1}/${V.liste.length}</div>
    </div>
    <div class="vst">
      <div class="vstk" style="color:${th.c}">Typisch Türkisch · ${esc(th.t)}</div>
      <p class="vstf">${esc(sq.f)}</p>
      <div class="sqo big">${sq.o.map((o, oi) => {
        let cls = "";
        if(fertig) cls = oi === sq.r ? "gut" : (oi === V.antwort ? "schlecht" : "");
        return `<button data-oi="${oi}" class="${cls}" ${fertig ? "disabled" : ""}>${esc(o)}</button>`;
      }).join("")}</div>
      ${fertig ? `<div class="vstw">
        <b>${ok ? "Genau so ist es." : "Nicht ganz."}</b>
        ${esc(sq.w)}
        <div class="vstmehr">${esc(c.h)} · ${esc(c.tr)}</div>
      </div>` : ""}
    </div>
    <div class="foot">
      ${fertig
        ? `<button class="cta" id="next">${V.i + 1 < V.liste.length ? "Weiter" : "Fertig"}</button>
           <button class="cta ghost" id="lesen">Den ganzen Text lesen</button>`
        : `<p class="vsthint">Wähle, was die Person meint</p>`}
    </div>`;

  document.getElementById("quit").onclick = vstScreen;
  if(!fertig){
    app.querySelectorAll("[data-oi]").forEach(b=>{
      b.onclick = () => {
        V.antwort = +b.dataset.oi;
        const richtig = V.antwort === sq.r;
        sfx(richtig ? "right" : "wrong");
        if(c.tr) wortAntwort(c.tr, richtig);
        if(richtig){
          V.richtig++;
          if(!S.kg) S.kg = {};
          if(!S.kg[kSchl(a.ti, a.ci)]){ S.kg[kSchl(a.ti, a.ci)] = true; }
          V.xp += 15; addXp(15);
        }
        save(); vstRender();
      };
    });
  } else {
    document.getElementById("next").onclick = () => { V.i++; V.antwort = null; vstRender(); };
    document.getElementById("lesen").onclick = () => kulturRead(a.ti, a.ci);
  }
}

function vstResult(){
  const n = V.liste.length, alle = V.richtig === n;
  const rest = vstOffen().length;
  sfx("done"); save();
  app.innerHTML = `<div class="result${alle ? " jubel" : ""}">
    ${mascot("happy")}
    <div class="bigword" style="color:var(--red);text-shadow:none">${V.richtig} von ${n}</div>
    <p>Verstehst du Türkisch?</p>
    <div class="scores">
      <div class="score gold"><div class="ic">${svgIcon("tea")}</div><div class="v" id="cnt">+0</div><div class="k">Çay</div></div>
      <div class="score blue"><div class="ic">${svgIcon("clock")}</div><div class="v">${fmtTime(V.t0)}</div><div class="k">Zeit</div></div>
    </div>
    <p style="margin-top:20px">${rest
      ? "Es warten noch " + rest + " Situationen."
      : "Du hast alle Situationen einmal richtig gehabt. Sie kommen über die Wörter wieder zu dir."}</p>
  </div>
  <div class="foot">
    <button class="cta red" id="cont">Zur Übersicht</button>
    ${rest ? `<button class="cta ghost" id="mehr">Noch eine Runde</button>` : ""}
  </div>`;
  document.getElementById("cont").onclick = vstScreen;
  const m = document.getElementById("mehr");
  if(m) m.onclick = startVst;
  hochzaehlen("cnt", V.xp, "+");
  if(alle) konfetti(false);
}
